    await sayAndWait(bits.length ? persona.line('caughtUp', { bits: bits.join(', and ').replace(/^./, (c) => c.toUpperCase()) })
      : persona.line('allQuiet'));
  }

  // Tray "Start over (back to the egg)": for meeting him again. Forgets your
  // name and besties, not the inbox.
  function startOver() {
    if (life.walking) stopWalking();
    setTuck(false, true);
    setPopover(false);
    closeAsk();
    finishPanel(null);
    hatched = false;
    setup = { stage: 'egg', crack: 0, summary: null, fresh: true };
    saveSetup();
    try { localStorage.removeItem('hatched'); } catch {}
    persona.reroll();
    introRecord = {};
    eggAsked = false;
    setUserName('');
    derived = null;
    tick();
  }

  // ======================================================================
  // His own timer: checks every sweep_minutes in work hours, the morning
  // rundown at its time, and a word from him whenever something fails.
  // (Only when the big brain works here; otherwise Claude's scheduled tasks
  // do this, as in SETUP.md.)
  // ======================================================================
  let prefs = null;
  async function loadPrefs() {
    if (!IS_TAURI) return;
    try { prefs = await invoke('read_prefs'); } catch { prefs = null; }
  }
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const hm = (s, dflt) => { const m = String(s || dflt).match(/(\d{1,2}):?(\d{2})?/); return m ? Number(m[1]) * 60 + Number(m[2] || 0) : 0; };
  function inWorkHours(d = new Date()) {
    const wh = (prefs && prefs.work_hours) || {};
    const days = wh.days || ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
    if (!days.includes(DAYS[d.getDay()])) return false;
    const now = d.getHours() * 60 + d.getMinutes();
    return now >= hm(wh.start, '9:00') && now < hm(wh.end, '17:30');
  }
  let lastSweepAt = 0;
  try { lastSweepAt = Number(localStorage.getItem('lastSweepAt')) || 0; } catch {}
  const today = () => new Date().toISOString().slice(0, 10);

  function helpItem(what, problem) {
    const why = {
      'not-logged-in': 'the big brain needs you to log it in again',
      'rate-limited': 'the big brain has hit its limit for now',
      'offline': 'I couldn’t reach the internet',
    }[problem] || 'the big brain ran into a problem';
    const spoken = what === 'rundown'
      ? `I wanted to put your morning rundown together, but ${why}. Can you help me?`
      : `I tried to check your apps, but ${why}. Can you help me?`;
    const item = { id: `help:${what}:${today()}`, kind: 'waiting', source: 'claude', rule: 'help', urgency: 2,
      title: what === 'rundown' ? 'I couldn’t make your morning rundown' : 'I couldn’t check your apps', spoken };
    if (IS_TAURI) invoke('add_local_items', { json: JSON.stringify([item]) });
  }

  async function runSweep() {
    if (!brain || brain.busy) return null;
    lastSweepAt = Date.now();
    try { localStorage.setItem('lastSweepAt', String(lastSweepAt)); } catch {}
    const r = await brain.run({ prompt: `Job: sweep\nNow: ${new Date().toString()}`, model: MODELS.quick, maxTurns: 40 });
    if (r.is_error) helpItem('sweep', r.text);
    return r;
  }
  async function runRundown() {
    try { localStorage.setItem('rundownOn', today()); } catch {}
    const r = await brain.run({ prompt: `Job: rundown\nNow: ${new Date().toString()}`, model: MODELS.main, maxTurns: 40 });
    if (r.is_error) helpItem('rundown', r.text);
  }
  function brainTick() {
    if (!IS_TAURI || !brain || !brainOk || !hatched || !prefs || brain.busy) return;
    const now = new Date();
    if (!inWorkHours(now)) return;
    const mins = now.getHours() * 60 + now.getMinutes();
    let doneToday = '';
    try { doneToday = localStorage.getItem('rundownOn') || ''; } catch {}
    const rundownAt = prefs.rundown_time ? hm(prefs.rundown_time) : 0;
    if (rundownAt && doneToday !== today() && mins >= rundownAt) { runRundown(); return; }
    // the rundown never turned up (and nothing else is going on): say so
    if (rundownAt && doneToday === today() && mins >= rundownAt + 20 && inbox
        && !inbox.items.some((it) => it.id === `digest:${today()}` || it.id === `help:rundown:${today()}`)) {
      helpItem('rundown', 'missing');
    }
    if (Date.now() - lastSweepAt >= Math.max(10, prefs.sweep_minutes || 30) * 60000) runSweep();
  }
  setInterval(brainTick, 60000);

  // --- what he says, and when ---
  let speakBusy = false;
  async function speakTick(now) {
    if (!hatched) return;
    if (!inbox || speakBusy) return;
    const cands = [];
    const live = new Set();
    for (const it of inbox.items) {
      live.add(it.id);
      if (it.handed_off || it.kind === 'note') continue;
      const a = announced[it.id];
      if (it.kind === 'reminder' && it.due_ms != null) {
        // a timed reminder speaks when it matters, not when it arrives
        if (now >= it.due_ms + LATE_AFTER_MS) {
          if (!a || !a.late) cands.push({ it, how: 'late', prio: 6 });
        } else if (now >= it.due_ms - REMIND_LEAD_MS) {
          if (!a || !a.soon) cands.push({ it, how: 'soon', prio: 6, minutes: Math.max(0, Math.round((it.due_ms - now) / 60000)) });
        }
        continue;
      }
      if (!a || a.sig !== sigOf(it)) { cands.push({ it, how: 'new', prio: KIND_RANK[it.kind] ?? 1 }); continue; }
      if (it.kind === 'waiting' && (a.nudges || 0) < MAX_NUDGES
          && now - a.at > Math.max(1, inbox.nudge_minutes) * 60000) {
        cands.push({ it, how: 'nudge', prio: 3 });
      }
    }
    // forget items that are gone, so the store never grows without bound
    let pruned = false;
    for (const id of Object.keys(announced)) if (!live.has(id)) { delete announced[id]; pruned = true; }
    if (!cands.length) { if (pruned) saveAnnounced(); return; }

    cands.sort((a, b) => b.prio - a.prio || (b.it.urgency || 0) - (a.it.urgency || 0));
    const first = cands[0];
    const news = first.how === 'new' ? cands.filter((c) => c.how === 'new') : [first];
    const text = voice.lineForItem(first.it, first.how, { minutes: first.minutes, count: news.length });
    // on the taskbar he comes up (and stops strolling) to tell you
    if (onTaskbar() && voice.canAnnounce()) {
      if (life.walking) stopWalking();
      setTuck(false);
      life.calmSince = Date.now();
    }
    speakBusy = true;
    let r;
    try {
      // A message gets the letter: it arrives and he opens it first, then he
      // reads it out while the reading loop plays, and puts it down when he
      // has finished talking. Only when he's free and the voice is ready, so
      // the letter never arrives to silence.
      const release = first.it.kind === 'message' && voice.canAnnounce() ? hold('reading') : null;
      if (release) {
        await sleep(introMs('reading'));
        r = await voice.announce(text);
        await sleep(400); // speech takes a moment to start
        for (let waited = 0; voice.isSpeaking() && waited < 25000; waited += 200) await sleep(200);
        await sleep(r ? 600 : 1500); // a beat to finish reading, or a glance if muted
        release();
      } else {
        const ignored = first.how === 'nudge' && ((announced[first.it.id] || {}).nudges || 0) >= 2
          && !['sweet', 'sleepy'].includes(persona.temperament());
        r = await voice.announce(text);
        await sleep(120);
        const pose = r && voice.isSpeaking() ? hold(ignored ? 'mad' : 'talk') : null;
        if (pose) {
          await sleep(280);
          for (let waited = 0; voice.isSpeaking() && waited < 20000; waited += 200) await sleep(200);
          pose();
        }
      }
    } finally { speakBusy = false; }
    if (r === false) return; // too soon after the last line: next tick
    for (const c of news) {
      const a = announced[c.it.id] || {};
      announced[c.it.id] = {
        sig: sigOf(c.it),
        at: now,
        nudges: c.how === 'nudge' ? (a.nudges || 0) + 1 : (c.how === 'new' ? 0 : a.nudges || 0),
        soon: a.soon || c.how === 'soon' || c.how === 'late',
        late: a.late || c.how === 'late',
      };
    }
    saveAnnounced();
  }

  // --- acting on an item: Do it (auto) or Talk it over (ask me first) both
  //     go to the big brain through his requests chat (request, below) ---
  function describe(it) {
    return [
      sourceLabel(it) && `(${sourceLabel(it)})`,
      it.who && `from ${it.who}`,
      it.title,
      it.link && `link: ${it.link}`,
    ].filter(Boolean).join(' ');
  }
  function talkOver(it) {
    const p = it.proposal || {};
    showAsk();
    request('What do you think we should do about this?', { about: describe(it) + (p.summary ? `\nYour idea was: ${p.summary}` : ''), plan: true });
  }
  function doIt(it) {
    const p = it.proposal || {};
    if (IS_TAURI) invoke('hand_off_item', { id: it.id });
    it.handed_off = true; // optimistic; Rust confirms on its next publish
    tick();
    showAsk();
    request(`Go ahead: ${p.summary}`, { about: describe(it) + `\n(clawd item ${it.id}; resolve it when done)` });
  }
  function tickOff(it) {
    if (IS_TAURI) invoke('dismiss_item', { id: it.id });
    if (inbox) inbox = { ...inbox, items: inbox.items.filter((x) => x.id !== it.id) };
    userCleared = true;
    tick();
    renderPopover();
  }
  function openItem(it) {
    if (it.kind === 'delivery') opened.add(it.id);
    if (it.link) openLink(it.link);
    userCleared = true;
    tick();
  }
  function openLink(url) {
    if (IS_TAURI && url) invoke('open_link', { url });
    else if (url) console.log('would open', url);
  }

  // --- popover: the inbox, grouped. Rows are rebuilt on change only;
  //     ages tick in place. ---
  function renderPopover() {
    if (popEl.hidden) return;
    const now = Date.now();
    popItems.textContent = '';
    popTreats.textContent = treatLine();
    if (!inbox) {
      popCount.textContent = IS_TAURI ? 'starting up…' : 'browser demo — try “demo inbox”';
      popFeed.hidden = true;
      return;
    }
    const att = attentionList(inbox, now);
    popCount.textContent = att.length
      ? `I need you for ${att.length === 1 ? 'one thing' : att.length + ' things'}`
      : (userName ? `All caught up, ${userName}!` : 'All caught up!');
    const fs = feedStatus(inbox, now);
    const err = inbox.feed_error ? 'couldn’t read ' + inbox.feed_error : '';
    popFeed.hidden = !(err || fs.text);
    popFeed.textContent = err || fs.text;
    popFeed.classList.toggle('warn', !!err || fs.stale);

    const open = inbox.items.filter((it) => !it.handed_off);
    const upcoming = open.filter((it) => it.kind === 'reminder' && !needsYou(it, now))
      .sort((a, b) => (a.due_ms || 0) - (b.due_ms || 0));
    const groups = [
      ['Waiting on you', att],
      ['Coming up', upcoming],
      ['Messages', open.filter((it) => it.kind === 'message')],
      ['Deliveries', open.filter((it) => it.kind === 'delivery')],
      ['Notes', open.filter((it) => !(it.kind in KIND_RANK) || it.kind === 'note')],
      ['With the big brain', inbox.items.filter((it) => it.handed_off)],
    ];
    let any = false;
    for (const [title, list] of groups) {
      if (!list.length) continue;
      any = true;
      const h = document.createElement('div');
      h.className = 'sec';
      h.textContent = title;
      popItems.appendChild(h);
      for (const it of list) popItems.appendChild(itemRow(it, now));
    }
    if (!any) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing yet. I’ll show you whatever the big brain finds.';
      popItems.appendChild(e);
    }
  }

  function itemRow(it, now) {
    const row = document.createElement('div');
    row.className = 'sess' + (it.link ? '' : ' nolink');
    if (it.link) row.title = 'open it';
    if (it.rule) row.title = (row.title ? row.title + ' · ' : '') + 'rule: ' + it.rule;
    row.onclick = () => (it.draft ? openDraft(it) : it.link ? openItem(it) : talkAbout(it));
    if (it.draft) row.title = 'read your draft';
    const top = document.createElement('div');
    top.className = 'top';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = KIND_COLOR[it.kind] || KIND_COLOR.note;
    const name = document.createElement('span');
    name.className = 'proj';
    // a person when there is one ("Priya"), else the thing itself ("Design review")
    name.textContent = it.who || it.title || sourceLabel(it) || it.id;
    top.append(dot, name);
    if (sourceLabel(it)) {
      const pill = document.createElement('span');
      pill.className = 'surface';
      pill.textContent = sourceLabel(it);
      top.appendChild(pill);
    }
    const age = document.createElement('span');
    age.className = 'age';
    if (it.kind === 'reminder' && it.due_ms != null) {
      age.dataset.due = it.due_ms;
      age.textContent = relDue(it.due_ms, now);
      age.title = fmtClock(it.due_ms);
    } else {
      const at = it.at_ms || it.first_seen_ms;
      age.dataset.at = at;
      age.textContent = fmtAge(now - at);
    }
    top.appendChild(age);
    if (!it.handed_off) {
      const tickBtn = document.createElement('button');
      tickBtn.className = 'mini tick';
      tickBtn.textContent = '✓';
      tickBtn.title = 'done, clear it';
      tickBtn.onclick = (e) => { e.stopPropagation(); tickOff(it); };
      top.appendChild(tickBtn);
    }
    row.appendChild(top);
    if (it.title && it.who) {
      const d = document.createElement('div');
      d.className = 'detail';
      d.textContent = it.title;
      d.title = it.title;
      row.appendChild(d);
    }
    if (it.proposal && it.proposal.summary && !it.handed_off) {
      const idea = document.createElement('div');
      idea.className = 'idea';
      const txt = document.createElement('span');
      txt.textContent = 'Idea: ' + it.proposal.summary;
      txt.title = it.proposal.summary;
      idea.appendChild(txt);
      const b = document.createElement('button');
      if (mode === 'auto') {
        b.className = 'mini doit';
        b.textContent = 'Do it';
        b.title = 'I’ll do it right away';
        b.onclick = (e) => { e.stopPropagation(); doIt(it); };
      } else {
        b.className = 'mini';
        b.textContent = 'Talk it over';
        b.title = 'let’s talk it over first; nothing gets sent';
        b.onclick = (e) => { e.stopPropagation(); talkOver(it); };
      }
      idea.appendChild(b);
      row.appendChild(idea);
    }
    return row;
  }

  // ONE centering rule for every panel: sprite center is the reference
  function placeCenteredOnBuddy(el, cssWidth) {
    if (cssWidth != null) el.style.width = cssWidth + 'px';
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const center = r.left + (rb.x + rb.w / 2) * pet.scale;
    const box = el.getBoundingClientRect().width;
    el.style.left = Math.max(8, Math.min(center - box / 2, window.innerWidth - box - 8)) + 'px';
  }

  // The CSS `bottom` that parks a panel just above the buddy's clear line,
  // so it grows UPWARD into the window's reserved headroom.
  function aboveBuddyBottomCss(gap) {
    const r = wrap.getBoundingClientRect();
    const clearTopCss = r.top + SPRITE_CLEAR_UNIT * pet.scale;
    return (window.innerHeight - clearTopCss + gap) + 'px';
  }

  function positionPopover() {
    placeCenteredOnBuddy(popEl, Math.min(300, window.innerWidth - 16));
    popEl.style.bottom = aboveBuddyBottomCss(10);
  }

  function setPopover(open) {
    if (popEl.hidden === !open) return;
    popEl.hidden = !open;
    if (open) { closeAsk(); positionPopover(); renderPopover(); btnsEl.hidden = true; }
    else SETTINGS_ROWS.forEach((r) => { r.hidden = true; }); // reopen on the inbox
    updateBubble(true);
    reportBounds();
  }
  // ages tick in place — never a full DOM rebuild, which could swallow a
  // click landing mid-press
  function updateAges() {
    if (popEl.hidden) return;
    const now = Date.now();
    popEl.querySelectorAll('.age[data-at]').forEach((el) => { el.textContent = fmtAge(now - Number(el.dataset.at)); });
    popEl.querySelectorAll('.age[data-due]').forEach((el) => { el.textContent = relDue(Number(el.dataset.due), now); });
    if (inbox) {
      const fs = feedStatus(inbox, now);
      if (!inbox.feed_error) popFeed.textContent = fs.text;
    }
  }
  setInterval(updateAges, 1000);
  window.addEventListener('blur', () => { setPopover(false); closeAsk(); });

  // --- speech bubble: the one thing that needs you, readable with zero
  //     clicks. Rebuilt only when WHAT it is about changes; the time text
  //     updates in place so a click is never lost to a rebuild. ---
  let bubKey = '';
  bubEl.addEventListener('click', () => {
    plog('click bubble');
    if (!hatched) { clickEgg(); return; }
    const it = derived && derived.top;
    if (!it) return;
    if (it.link) openItem(it);
    else talkAbout(it);
  });
  function bubbleText(d, now) {
    const it = d.top;
    if (d.state === 'clock') {
      const when = it.due_ms == null ? '' : (now < it.due_ms ? 'starts ' + relDue(it.due_ms, now) : 'started ' + fmtAge(now - it.due_ms) + ' ago');
      return { title: `Heads up: ${it.title || 'your reminder'}`, detail: [when, it.who].filter(Boolean).join(' · ') };
    }
    if (d.state === 'package') return { title: 'I just finished something!', detail: it.title || 'Something from the big brain' };
    const more = d.count > 1 ? `  (+${d.count - 1} more)` : '';
    const from = it.who || sourceLabel(it);
    return { title: (userName ? `${userName}, I need your help!` : 'I need your help!') + more, detail: (from ? from + ': ' : '') + (it.title || '') };
  }
  function updateBubble(force = false) {
    const d = derived;
    if (!hatched) {
      if (!bubEl.hidden) { bubEl.hidden = true; bubKey = ''; reportBounds(); }
      return;
    }
    const show = !!(d && d.top) && popEl.hidden && askEl.hidden && chatEl.hidden
      && (d.state === 'needs_input' || d.state === 'clock' || d.state === 'package');
    if (!show) {
      if (!bubEl.hidden) { bubEl.hidden = true; bubKey = ''; reportBounds(); }
      return;
    }
    const now = Date.now();
    const { title, detail } = bubbleText(d, now);
    const key = `${d.state}|${d.top.id}|${d.count}|${mode}|${title}`;
    if (!force && key === bubKey && !bubEl.hidden) {
      const dd = bubEl.querySelector('.b-detail');
      if (dd && dd.textContent !== detail) dd.textContent = detail;
      return;
    }
    bubKey = key;
    btnsEl.hidden = true; // the bubble owns the spot by the buddy
    bubEl.hidden = false;
    bubEl.classList.toggle('calm', d.state === 'package');
    bubEl.textContent = '';
    const t = document.createElement('div');
    t.className = 'b-title';
    t.textContent = title;
    const dd = document.createElement('div');
    dd.className = 'b-detail';
    dd.textContent = detail;
    bubEl.append(t, dd);
    const p = d.top.proposal;
    if (p && p.summary) {
      const act = document.createElement('div');
      act.className = 'b-act';
      const b = document.createElement('button');
      if (mode === 'auto') {
        b.className = 'mini doit'; b.textContent = 'Do it';
        b.onclick = (e) => { e.stopPropagation(); doIt(d.top); };
      } else {
        b.className = 'mini'; b.textContent = 'Talk it over';
        b.onclick = (e) => { e.stopPropagation(); talkOver(d.top); };
      }
      const s = document.createElement('span');
      s.textContent = p.summary;
      act.append(b, s);
      bubEl.appendChild(act);
    }
    const tail = document.createElement('div');
    tail.className = 'b-tail';
    bubEl.appendChild(tail);
    bubEl.style.top = 'auto';
    bubEl.style.bottom = aboveBuddyBottomCss(10);
    bubEl.style.maxWidth = Math.min(320, window.innerWidth - 16) + 'px';
    placeCenteredOnBuddy(bubEl);
    reportBounds();
  }

  // --- his requests chat (the "+"): you type, he does it with the big
  //     brain (typing on his little laptop meanwhile) and tells you when
  //     it's done. Anything going to another person waits for your tap. ---
  const askLog = document.getElementById('ask-log');
  let thread = [];
  try { thread = JSON.parse(localStorage.getItem('thread') || '[]') || []; } catch {}
  let threadSession = null;
  let threadAt = 0;
  let threadActions = null; // buttons under his latest message
  let threadTyping = false;
  const saveThread = () => {
    thread = thread.slice(-50);
    try { localStorage.setItem('thread', JSON.stringify(thread, (k, v) => (k === 'onSend' ? undefined : v))); } catch {}
  };

  function renderThread() {
    askLog.textContent = '';
    if (!thread.length) {
      const e = document.createElement('div');
      e.className = 'msg him';
      e.textContent = userName ? `Hi ${userName}! What can I do for you?` : 'Hi! What can I do for you?';
      askLog.appendChild(e);
    }
    const recent = thread.slice(-20);
    recent.forEach((m, i) => {
      const e = document.createElement('div');
      e.className = 'msg ' + m.who;
      e.textContent = m.text;
      askLog.appendChild(e);
      if (m.card) askLog.appendChild(draftCard(m, i === recent.length - 1));
    });
    if (threadActions) {
      const row = document.createElement('div');
      row.className = 'msg-actions';
      for (const a of threadActions) {
        const b = document.createElement('button');
        b.className = 'mini' + (a.primary ? ' go' : '');
        b.textContent = a.label;
        b.onclick = (e) => { e.stopPropagation(); threadActions = null; renderThread(); a.run(); };
        row.appendChild(b);
      }
      askLog.appendChild(row);
    }
    if (threadTyping) {
      const e = document.createElement('div');
      e.className = 'msg him typing';
      e.textContent = '…';
      askLog.appendChild(e);
    }
    askLog.scrollTop = askLog.scrollHeight;
    if (!askEl.hidden) { askEl.style.bottom = aboveBuddyBottomCss(10); reportBounds(); }
  }
  // A message he's about to send for you, as a card: which app, to whom,
  // the subject and the message, with a real Send button. Only the newest
  // card is live; once sent it says so.
  function draftCard(m, live) {
    const c = m.card;
    const card = document.createElement('div');
    card.className = 'draft';
    const app = document.createElement('div');
    app.className = 'd-app';
    app.textContent = c.kind === 'draft' ? (c.app ? `${c.app} draft` : 'Draft') : c.app ? `New ${c.app} message` : 'New message';
    card.appendChild(app);
    const field = (label, value) => {
      if (!value) return;
      const f = document.createElement('div');
      f.className = 'd-field';
      f.append(label + ' ');
      const b = document.createElement('b');
      b.textContent = value;
      f.appendChild(b);
      card.appendChild(f);
    };
    field('To', c.to);
    field('Subject', c.subject);
    if (c.body) {
      const body = document.createElement('div');
      body.className = 'd-body';
      body.textContent = c.body;
      card.appendChild(body);
    }
    const row = document.createElement('div');
    row.className = 'd-actions';
    if (c.kind === 'draft') {
      const btn = (label, cls, run, title = '') => {
        const b = document.createElement('button');
        b.className = cls;
        b.textContent = label;
        if (title) b.title = title;
        b.onclick = (e) => { e.stopPropagation(); run(b); };
        row.appendChild(b);
      };
      btn('Copy', 'change', async (b) => {
        const text = (c.subject ? `Subject: ${c.subject}\n\n` : '') + c.body;
        try { await navigator.clipboard.writeText(text); b.textContent = 'Copied ✓'; } catch { b.textContent = 'Couldn’t copy'; }
      });
      btn('Open in Claude', 'change', () => openDraftInClaude(c), 'Starts a Claude chat with this draft, to keep working on it there');
      if (c.link) btn(`Open in ${c.app || 'the app'}`, 'change', () => openLink(c.link));
      btn('Change it', 'change', () => { chatDraft = c; askInput.placeholder = 'What should I change?'; askInput.focus(); });
      if (live) btn('Send it…', 'send', () => { chatDraft = null; think(`Send this draft${c.to ? ' to ' + c.to : ''} exactly as written.`, { resume: c.session || threadSession }); });
      card.appendChild(row);
      return card;
    }
    if (c.sent) {
      const done = document.createElement('span');
      done.className = 'd-sent';
      done.textContent = 'Sent ✓';
      row.appendChild(done);
    } else if (c.sending) {
      const going = document.createElement('span');
      going.className = 'd-field';
      going.textContent = 'Sending…';
      row.appendChild(going);
    } else if (live && c.onSend) {
      const send = document.createElement('button');
      send.className = 'send';
      send.textContent = 'Send';
      send.onclick = (e) => { e.stopPropagation(); c.onSend(); };
      const change = document.createElement('button');
      change.className = 'change';
      change.textContent = 'Change it';
      change.onclick = (e) => { e.stopPropagation(); askInput.placeholder = 'What should I change?'; askInput.focus(); };
      row.append(send, change);
    } else {
      const idle = document.createElement('span');
      idle.className = 'd-field';
      idle.textContent = 'Not sent';
      row.appendChild(idle);
    }
    card.appendChild(row);
    return card;
  }

  function addMsg(who, text, actions = null, card = null) {
    thread.push({ who, text, t: Date.now(), card });
    threadActions = actions;
    saveThread();
    renderThread();
  }

  function showAsk() {
    setPopover(false);
    hideBtns();
    finishPanel(null);
    askEl.hidden = false;
    askInput.value = '';
    askInput.placeholder = 'Tell me what you need…';
    placeCenteredOnBuddy(askEl, Math.min(340, window.innerWidth - 16));
    renderThread();
    updateBubble();
    reportBounds();
    setTimeout(() => askInput.focus(), 0);
  }
  function closeAsk() {
    if (askEl.hidden) return;
    askEl.hidden = true;
    updateBubble(true);
    reportBounds();
  }
  askInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeAsk(); return; }
    if (e.key !== 'Enter') return;
    const text = askInput.value.trim();
    if (!text) return;
    askInput.value = '';
    askInput.placeholder = 'Tell me what you need…';
    request(text);
  });
  askEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') chatAbout = null; });

  // the old way, when the big brain can't run here: Claude app, text pasted
  async function openInClaude(prompt) {
    try { await navigator.clipboard.writeText(prompt); } catch {}
    if (IS_TAURI) invoke('ask_claude', { prompt });
  }

  function errorLine(problem) {
    if (problem === 'not-logged-in') return 'The big brain needs you to log it in again.';
    if (problem === 'rate-limited') return 'The big brain needs a little break. Try me again in a bit!';
    if (problem === 'offline') return 'I can’t reach the internet right now.';
    return 'Hmm, the big brain couldn’t do that one. Can you try again?';
  }
  const firstName = (to) => String(to).split(/[,<@]/)[0].trim().split(/\s+/)[0] || String(to);

  // Open his chat about one item: he says what it is, and whatever you type
  // next goes to the big brain with it (answering his question, fixing it).
  let chatAbout = null;
  function talkAbout(it) {
    showAsk();
    chatAbout = it;
    addMsg('him', it.spoken || [it.who, it.title].filter(Boolean).join(': '));
    askInput.placeholder = 'Tell me…';
  }

  async function request(text, { about = '', plan = mode === 'ask' } = {}) {
    if (!about && chatAbout) {
      about = describe(chatAbout) + `\n(clawd item ${chatAbout.id}; resolve it once this is sorted)`;
      chatAbout = null;
    }
    addMsg('you', text);
    if (!brain || !brainOk) {
      await openInClaude(`Using the clawd skill: ${about ? about + '\n\n' : ''}${text}`);
      addMsg('him', 'I can’t reach the big brain from here, so I opened the Claude app for you. If the box is empty, press Ctrl+V.');
      return;
    }
    const resume = chatDraft && chatDraft.session ? chatDraft.session : null;
    if (chatDraft) {
      about = `(changing the draft${chatDraft.to ? ' to ' + chatDraft.to : ''} you wrote: end with a new DRAFT line)` + (about ? '\n' + about : '');
      chatDraft = null;
    }
    await think(`Job: request\nMode: ${plan ? 'ask first' : 'auto'}\nNow: ${new Date().toString()}\n\n${about ? 'About: ' + about + '\n\n' : ''}${text}`, { plan, resume });
  }

  async function think(prompt, { plan = false, alsoAllow = [], resume = null, quiet = false } = {}) {
    threadTyping = true;
    threadActions = null;
    renderThread();
    const release = hold('working', true); // typing on his little laptop
    const session = resume || (Date.now() - threadAt < 30 * 60000 ? threadSession : null);
    const r = await brain.run({ prompt, model: MODELS.main, mode: plan ? 'plan' : 'auto', resume: session, alsoAllow });
    if (release) release();
    threadTyping = false;
    threadSession = r.session || threadSession;
    threadAt = Date.now();
    if (r.is_error) {
      const line = errorLine(r.text);
      addMsg('him', line, r.text === 'not-logged-in' ? [{ label: 'Log me in', primary: true, run: () => brain.open('login') }] : null);
      voice.say(line);
      return false;
    }
    const reply = String(r.text || r.texts[r.texts.length - 1] || '').trim() || 'Done!';
    const sends = (r.denials || []).filter((d) => String(d.tool).startsWith('mcp__'));
    if (sends.length) {
      const d = describeSend(sends[0]);
      const appName = (String(sends[0].tool).match(/^mcp__(?:claude_ai_)?([^_]+(?:_[A-Z][a-z]+)*)__/) || [])[1];
      const card = { app: appName ? appName.replace(/_/g, ' ') : '', to: d.to, subject: d.subject, body: d.body, sent: false };
      const tool = sends[0].tool;
      card.onSend = async () => {
        card.onSend = null;
        card.sending = true;
        renderThread();
        const ok = await think('Yes, send it exactly as drafted.', { resume: threadSession, alsoAllow: [tool], quiet: true });
        card.sending = false;
        if (ok) {
          card.sent = true;
          saveThread();
          renderThread();
          flourish('happy_wiggle', null, true);
          voice.chirp(null, 'happy');
        }
      };
      addMsg('him', `Here’s what I’ll send${d.to ? ' to ' + firstName(d.to) : ''}:`, null, card);
      voice.say(`Here’s what I’ll send${d.to ? ' to ' + firstName(d.to) : ''}. Should I send it?`);
      if (askEl.hidden) showAsk();
      return false;
    }
    const draft = readDraft([...r.texts, r.text]);
    if (draft && !plan) {
      draft.session = threadSession || '';
      const said = withoutDraft(reply).split('\n')[0].trim()
        || `Your draft${draft.to ? ' to ' + firstName(draft.to) : ''} is ready!`;
      const id = 'draft:' + Date.now();
      addMsg('him', said, null, { kind: 'draft', itemId: id, ...draft });
      // on his list too, so it's there when you come back for it
      if (IS_TAURI) {
        invoke('add_local_items', { json: JSON.stringify([{ id, kind: 'delivery', source: (draft.app || 'claude').toLowerCase(),
          who: draft.to, title: draft.subject ? 'Draft: ' + draft.subject : 'Draft' + (draft.to ? ' to ' + firstName(draft.to) : ''),
          spoken: said, rule: 'draft', draft }]) }).catch(() => {});
        opened.add(id); // you've seen it if the chat is open; the list keeps it
      }
      voice.say(spokenLine(said));
      if (askEl.hidden && !quiet) showToast(spokenLine(said));
      return true;
    }
    if (plan) {
      addMsg('him', reply, [
        { label: 'Go ahead', primary: true, run: () => think('Go ahead.', { resume: threadSession }) },
        { label: 'Never mind', run: () => addMsg('him', 'OK, never mind!') },
      ]);
      voice.say(spokenLine(reply));
      return true;
    }
    addMsg('him', reply);
    voice.say(spokenLine(reply));
    if (askEl.hidden && !quiet) showToast(spokenLine(reply));
    return true;
  }

  // "Change it" on a draft: the next thing you type goes to the run that
  // wrote it
  let chatDraft = null;
  // a draft on his list, clicked: back in his chat with the card
  function openDraft(it) {
    opened.add(it.id);
    showAsk();
    const last = thread[thread.length - 1];
    if (!(last && last.card && last.card.itemId === it.id)) {
      addMsg('him', `Here’s your draft${it.draft.to ? ' to ' + firstName(it.draft.to) : ''}:`, null, { kind: 'draft', itemId: it.id, ...it.draft });
    }
    tick();
  }
  // keep working on it in the Claude app: a new chat with the draft in it
  function openDraftInClaude(c) {
    const body = String(c.body || '').slice(0, 3000);
    const prompt = `Here’s a draft${c.app ? ' ' + c.app : ''} message${c.to ? ' to ' + c.to : ''}${c.subject ? ' (subject: ' + c.subject + ')' : ''}. Help me work on it.\n\n${body}`;
    openInClaude(prompt);
  }

  let toastTimer = null;
  function showToast(text) {
    clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.hidden = false;
    placeCenteredOnBuddy(toastEl);
    toastEl.style.bottom = aboveBuddyBottomCss(10);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 5000);
  }

  pet.on('scale', (s) => {
    wrap.style.width = (160 * s) + 'px';
    wrap.style.height = (160 * s) + 'px';
    layoutWrap();
    document.getElementById('size-readout').textContent = s.toFixed(2) + '×';
    try { localStorage.setItem('petScale', String(s)); } catch {}
  });

  // --- debug panel (browser demo) ---
  const btns = document.getElementById('state-buttons');
  function buildStateButtons() {
    btns.textContent = '';
    STATES.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s.replace('_', ' ');
      b.dataset.state = s;
      const ph = pet.style.clips[s].placeholderFor;
      if (ph) { b.classList.add('placeholder'); b.title = 'placeholder: shows ' + ph + ' until drawn'; }
      b.onclick = () => setState(s);
      b.classList.toggle('active', s === pet.state);
      btns.appendChild(b);
    });
  }
  buildStateButtons();

  function setState(s, detail = null) {
    pet.setState(s, detail);
  }
  pet.on('state', ({ state }) => {
    [...btns.children].forEach((b) => b.classList.toggle('active', b.dataset.state === state));
  });

  document.getElementById('bg-light').onchange = (e) => {
    document.body.classList.toggle('demo-light', e.target.checked);
    document.body.classList.toggle('demo-dark', !e.target.checked);
  };

  // A browser-demo inbox, shaped exactly like Rust's payload, so the whole
  // presentation (bubble, popover, voice, timers) can be tried without a
  // Tauri host or a Claude.
  function demoInbox() {
    const now = Date.now();
    const item = (o) => ({ first_seen_ms: now, updated_ms: now, handed_off: false, at_ms: null, due_ms: null, expires_ms: null,
      source: '', who: '', title: '', spoken: '', link: '', urgency: 1, resolved: false, rule: '', proposal: null, ...o });
    return {
      items: [
        item({ id: 'demo-vip', kind: 'waiting', source: 'slack', who: 'Priya (VIP)', title: 'Is the Q3 deck final? Need it for 3pm.',
          spoken: 'Priya asked if the Q3 deck is final. She needs it for three.', urgency: 2, rule: 'vip-slack-unread',
          link: 'https://app.slack.com/client', first_seen_ms: now - 4 * 60000,
          proposal: { summary: 'Reply: “Yes, v3 in the team drive is final.”', draft_link: '' } }),
        item({ id: 'demo-mtg', kind: 'reminder', source: 'gcal', title: 'Design review', due_ms: now + 90 * 1000,
          link: 'https://meet.google.com/', urgency: 2 }),
        item({ id: 'demo-later', kind: 'reminder', source: 'gcal', title: '1:1 with Sam', due_ms: now + 75 * 60000 }),
        item({ id: 'demo-msg', kind: 'message', source: 'slack', who: 'Sam', title: 'Launch moved to Thursday',
          spoken: 'Sam says the launch moved to Thursday.' }),
        item({ id: 'demo-digest', kind: 'delivery', source: 'claude', title: 'morning digest', link: 'https://claude.ai/' }),
      ],
      last_heard_ms: now - 3 * 60000, quiet_until_ms: null, sweep_minutes: 15, nudge_minutes: 20,
      feed_error: '', inbox_dir: '(demo)', http_ok: false,
    };
  }
  document.getElementById('demo-inbox').onclick = () => { inbox = demoInbox(); tick(); renderPopover(); };
  document.getElementById('demo-clear').onclick = () => {
    inbox = { ...(inbox || demoInbox()), items: [] }; userCleared = true; tick(); renderPopover();
  };

  // --- resize: + / − keys while the pet window is focused (click it first);
  //     0 resets to the default size ---
  const DEFAULT_SCALE = 1.75;
  function resizeTo(next) {
    pet.setScale(next);
    if (IS_TAURI) {
      invoke('set_pet_scale', { scale: pet.scale });
      reportBounds();
    }
  }

  // --- keyboard: +/−/0 resize; q quits the desktop pet. Never while typing
  //     in the Ask box: those keys are words there. ---
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.closest && e.target.closest('input, textarea')) return;
    const n = parseInt(e.key, 10);
    if (e.key === '0') resizeTo(DEFAULT_SCALE);
    else if (!IS_TAURI && n >= 1 && n <= STATES.length) setState(STATES[n - 1]);
    else if (e.key === '+' || e.key === '=') resizeTo(pet.scale * 1.15);
    else if (e.key === '-' || e.key === '_') resizeTo(pet.scale / 1.15);
    else if (e.key === 'd' && !IS_TAURI) {
      const dbg = document.getElementById('debug');
      dbg.style.display = dbg.style.display === 'grid' ? 'none' : 'grid';
    } else if (e.key === 'r' && !IS_TAURI) location.reload();
    else if (e.key === 'q' && IS_TAURI) invoke('quit_app');
    else if (e.key === 'Escape') { setPopover(false); closeAsk(); }
  });

  // --- waking: any grab of the buddy ends a nap early ---
  function onBuddy(e) {
    // his bubbles sit over the top of his hit area: a click on one is for the
    // bubble (a button, a text box), never a click on him
    if (e.target && e.target.closest && e.target.closest('#popover, #bubble, #petbtns, #askbox, #chat, #toast, #debug')) return false;
    const rect = canvas.getBoundingClientRect();
    const b = pet.opaqueBounds();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    return x >= b.x - HALO && x < b.x + b.w + HALO && y >= b.y - HALO && y < b.y + b.h + HALO;
  }

  document.addEventListener('pointerdown', (e) => {
    if (!onBuddy(e)) return;
    voice.warmAudio();
    // a soft happy chirp the instant he's touched (the egg makes its own noises)
    if (hatched && !hatching) voice.chirp(null, 'light');
    if (pet.state === 'sleeping') setState('idle');
  });

  // a plain click on him: the popover, and a happy wiggle if he is free
  function clickBuddy() {
    plog('click him (hatched=' + hatched + ', pop=' + !popEl.hidden + ')');
    if (!hatched) { clickEgg(); return; }
    const opening = popEl.hidden;
    setPopover(opening);
    if (opening) flourish(Math.random() < 0.25 ? 'hearts' : 'happy_wiggle', null);
  }

  // --- drag: press + >2px movement drags the window (moved by Rust, not
  //     the OS move loop); a plain click toggles the popover ---
  if (IS_TAURI) {
    let down = null, dragging = false;
    const clear = () => { down = null; dragging = false; };
    const endDrag = () => {
      if (dragging) { putDown(); invoke('end_drag').then(refreshTaskbar); }
      life.dragging = false;
      clear();
    };
    document.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !onBuddy(e)) return;
      down = { x: e.screenX, y: e.screenY };
      dragging = false;
      try { document.body.setPointerCapture(e.pointerId); } catch {}
    });
    document.addEventListener('pointermove', (e) => {
      if (!down || dragging) return;
      if (!(e.buttons & 1)) { clear(); return; }
      if (Math.hypot(e.screenX - down.x, e.screenY - down.y) > 2) {
        dragging = true;
        life.dragging = true;
        if (life.walking) stopWalking();
        setTuck(false, true);
        pickUp();
        const dpr = window.devicePixelRatio || 1;
        invoke('start_drag', { x: down.x * dpr, y: down.y * dpr });
      }
    });
    document.addEventListener('pointerup', (e) => {
      if (e.button !== 0) return;
      if (down && !dragging) clickBuddy();
      endDrag();
    });
    document.addEventListener('pointercancel', endDrag);
    document.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('blur', endDrag);
  } else {
    document.addEventListener('click', (e) => { if (onBuddy(e)) clickBuddy(); });
  }

  // Nothing is spoken until the boot wave has handed off: a pet that
  // announces itself at every launch gets muted by week two.
  let voiceArmed = false;

  // --- treats: the second round button feeds him ---
  const popTreats = document.getElementById('pop-treats');
  const treatLayer = new TreatSprite(pet, wrap);
  // the body bobs for exactly as long as he is making a noise
  voice.onSpeaking((on, kind) => {
    pet.setSpeaking(on);
    pet.setSquint(on && kind === 'chirp');
  });

  const PECKISH_MS = 3 * 60 * 60 * 1000;
  // Nat's eat animation (5.1 s, both skins) holds its own cookie from the
  // first frame, so the dropped treat hands over as soon as he starts. Three
  // bites, the cookie shrinking at frames 7-10, 19-22 and 31-34: a monch as
  // each bite goes in and another as he chews it off.
  const BITE_MS = 60;
  const MUNCH_MS = [700, 1000, 1900, 2200, 3100, 3400];
  // ...and a happy chirp once the last crumb is gone
  const YUM_MS = 3650;
  const MEAL_MS = 5100;
  const STRANDED_MS = 3000;

  let feeding = false;

  let treats = { count: 0, lastFedAt: 0 };
  try {
    const raw = localStorage.getItem('treats');
    if (raw) {
      const t = JSON.parse(raw) || {};
      treats = { count: Number(t.count) || 0, lastFedAt: Number(t.lastFedAt) || 0 };
    }
  } catch {}

  function treatLine() {
    if (!treats.count) return 'treats: 0';
    return 'treats: ' + treats.count
      + (treats.lastFedAt ? ' · last ' + fmtAge(Date.now() - treats.lastFedAt) + ' ago' : '');
  }
  function isPeckish() { return Date.now() - treats.lastFedAt > PECKISH_MS; }

  function outroMs(name) {
    const c = pet.style.clips[name];
    return c && c.stages ? c.stages.outro.reduce((a, s) => a + s.ms, 0) : 0;
  }

  function feed() {
    if (feeding) return;
    feeding = true;
    const waking = pet.state === 'sleeping';
    if (waking) setState('idle');
    hideBtns();
    setTimeout(() => {
      treatLayer.drop();
      setTimeout(() => setState('eating'), FALL_MS);
      setTimeout(() => {
        if (feeding && pet.state !== 'eating') { treatLayer.clear(); feeding = false; }
      }, FALL_MS + STRANDED_MS);
    }, waking ? outroMs('sleeping') : 0);
  }

  pet.on('state', ({ state }) => {
    if (state !== 'eating') return;
    for (const ms of MUNCH_MS) setTimeout(() => { if (pet.state === 'eating') voice.munch(); }, ms);
    setTimeout(() => { if (pet.state === 'eating') voice.chirp(null, 'happy'); }, YUM_MS);
    setTimeout(() => {
      treatLayer.clear();
      if (pet.state !== 'eating') return;
      treats = { count: treats.count + 1, lastFedAt: Date.now() };
      try { localStorage.setItem('treats', JSON.stringify(treats)); } catch {}
      treatBtn.classList.remove('peckish');
      renderPopover();
    }, BITE_MS);
    setTimeout(endMeal, MEAL_MS);
  });

  function endMeal() {
    feeding = false;
    if (pet.state !== 'eating') return;
    applyDerived();
  }

  // --- idle variety: every so often, while nothing is going on, a little
  //     something (placeholders until drawn). Rare on purpose: each one
  //     restarts the nap clock. ---
  setInterval(() => {
    if (onTaskbar()) return; // on the taskbar, lifeTick does the peeking
    if (pet.state !== 'idle' || !derived || derived.state !== 'idle' || Math.random() > 0.4) return;
    flourish(Math.random() < 0.5 ? 'peek' : 'happy_wiggle', null);
  }, 4 * 60 * 1000);

  // Greet the fresh app launch with a wave, then settle into the inbox. An
  // egg doesn't wave: before he hatches he boots straight into his egg, so
  // he's never seen as himself before you've met.
  if (!hatched) {
    voiceArmed = true;
    greeting = false;
    derived = null;
    tick();
    setState(eggState());
  } else setState('wave');
  if (hatched) setTimeout(() => {
    voiceArmed = true;
    greeting = false;
    // Whatever arrived during the wave is applied now, always: an ask that
    // came in mid-greeting must not wait for the next change to show.
    derived = null; // force the next tick to apply
    tick();
    if (pet.state === 'wave' && derived && derived.state === 'idle') setState('idle');
    if (hatched) setTimeout(bootHello, 1200);
    if (hatched) setTimeout(offerTakeOver, 20000);
  }, 1875);

  setInterval(tick, 1000);

  // Once hatched: sometimes a short hello when he starts up (never the same
  // twice in a row, and not outside work hours)
  // Set up the fallback way (Cowork runs his checks) but able to run the big
  // brain himself here? Offer to take over: lighter, and his own chat.
  async function offerTakeOver() {
    if (!IS_TAURI || !brain || brainOk || !hatched) return;
    let asked = '';
    try { asked = localStorage.getItem('takeOverAsked') || ''; } catch {}
    if (asked === today()) return;
    let st;
    try { st = await brain.status(); } catch { return; }
    if (!st || !st.ready) return;
    try { localStorage.setItem('takeOverAsked', today()); } catch {}
    const r = await panel({ title: 'I can do my own check-ins now!', sub: 'I’d use the big brain myself: lighter on your plan, and you can ask me things right here. Want me to?',
      buttons: [{ label: 'Yes please', primary: true }, { label: 'Not now' }], speak: 'I can do my own check-ins now! Want me to?' });
    if (!r || r.button !== 'Yes please') return;
    setBrainOk(true);
    await okApps(st);
    await loadPrefs();
    await sayAndWait('Yay! I’ll take it from here.');
    await panel({ title: 'One last thing', sub: 'In the Claude app, delete the Cowork scheduled tasks called “Claw’d sweep” and “Claw’d rundown”, so we don’t both check.',
      buttons: [{ label: 'Done', primary: true }] });
    runSweep();
  }

  async function bootHello() {
    await loadPrefs();
    if (prefs && !inWorkHours()) return;
    if (Math.random() > 0.6) return;
    let pickLine = persona.line('bootHi', { name: userName });
    // no name yet, or not morning any more: keep it simple
    if (!userName && /\{name\}|,\s*!|\s!$/.test(pickLine)) pickLine = 'Hi!';
    if (new Date().getHours() >= 12 && pickLine.startsWith('Morning')) pickLine = userName ? `Hi ${userName}!` : 'Hi!';
    voice.say(pickLine.replace(/\s+([!?.])/g, '$1'));
  }

  // Tauri host wiring
  if (IS_TAURI) {
    document.body.classList.add('tauri');
    window.addEventListener('resize', () => { reportBounds(); reportAnchor(); });
    // Rust owns the scale (it restores it from config)
    invoke('get_pet_scale').then((s) => {
      pet.setScale(s);
      reportBounds();
    });

    const { listen } = window.__TAURI__.event;
    // Rust's cursor poller is the hover ground truth
    listen('pet-hover', (e) => {
      life.hovering = !!e.payload;
      if (e.payload) {
        // hovering the top of his head pops him up to say hi
        if (life.tucked) setTuck(false); // (the chirp is for clicks only)
        showNewBtn();
      } else {
        scheduleHideNewBtn();
        // he ducks back down soon after you move away
        life.calmSince = Math.min(life.calmSince, Date.now() - SETTLE_MS + HOVER_RETUCK_MS);
      }
    });
    listen('walk-done', () => finishWalk(true));
    listen('tray', (e) => {
      if (e.payload === 'home') invoke('go_to_taskbar', { centerX: null }).then(refreshTaskbar);
      else if (e.payload === 'restart') startOver();
      else summon();
    });
    refreshTaskbar();
    setInterval(refreshTaskbar, 30000);
    invoke('waiting_for_claude').then((w) => {
      if (!w) return;
      plog('waiting for Claude');
      voice.setMuted(true);
    }).catch(() => {});
    listen('claude-opened', () => {
      plog('Claude opened: out he comes');
      voice.setMuted(false);
      refreshTaskbar();
      if (!hatched) return;
      setTuck(false, true);
      life.calmSince = Date.now();
      flourish('wave', 1800, true);
      setTimeout(bootHello, 1400);
    });
    invoke('load_intro').then((v) => { if (v) { introRecord = v; if (v.name && !userName) setUserName(String(v.name)); } });
    loadPrefs(); // the taskbar can move, resize or auto-hide
    // listener FIRST, then the snapshot, so a stale snapshot can never
    // overwrite a raced-in live event
    let gotLive = false;
    listen('pet-state', (e) => { gotLive = true; inbox = e.payload; tick(); renderPopover(); })
      .then(() => invoke('get_pet_state'))
      .then((p) => { if (p && !gotLive) { inbox = p; tick(); renderPopover(); } });
  } else {
    document.body.classList.add('demo-dark');
    pet._emit('scale', pet.scale);
  }

  // debug/test handle
  window.__clawd = {
    pet, setState, setStyle: setArtStyle, setPopover, renderPopover, feed, treatLayer, voice, setMode,
    showAsk, tick, derive, demoInbox, life, hatchNow, startOver, clickEgg, request, panel, runSweep, get hatched() { return hatched; }, get setup() { return setup; }, setTuck, walkTo, stroll, peekOnce, refreshTaskbar,
    get inbox() { return inbox; }, set inbox(p) { inbox = p; tick(); renderPopover(); },
    get derived() { return derived; }, get treats() { return treats; }, get announced() { return announced; },
  };
</script>
</body>
</html>
