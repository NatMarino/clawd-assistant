<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claw'd</title>
<style>
  /* html/body must stay transparent or WebView2 paints white (plan §window) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }

  /* browser-demo desk backgrounds — added by script, never in Tauri */
  body.demo-dark  { background: #1e1f24; }
  body.demo-light { background: #e8e6e1; }

  #pet-wrap {
    position: fixed;
    right: 40px; bottom: 24px;
    width: 160px; height: 160px;
  }
  #pet-canvas { image-rendering: pixelated; display: block; }
  /* on the taskbar: popping up is springy, tucking back in is not */
  body.on-taskbar #pet-canvas { transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
  body.on-taskbar #pet-canvas.tucking { transition: transform .7s ease-in; }
  #pet-canvas.snap { transition: none !important; }
  /* the treat shares the buddy's unit space: same box, same scale, laid
     straight over the pet canvas. Decorative only — never clickable. */
  #treat-canvas {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; pointer-events: none;
  }

  /* inside the real Tauri window the pet fills it and debug hides.
     110px bottom margin = the window's BUBBLE_ROOM (keep in sync with Rust).
     Horizontally CENTERED in the window: panels center on the sprite. */
  body.tauri #pet-wrap { left: 50%; transform: translateX(-50%); bottom: 110px; right: auto; }
  body.tauri #debug { display: none; }

  #debug {
    position: fixed; top: 14px; left: 14px;
    background: rgba(20,20,24,.92); color: #ddd;
    border: 1px solid #444; border-radius: 10px;
    padding: 12px 14px; font-size: 12px;
    display: grid; gap: 8px; width: 240px;
  }
  #debug h1 { font-size: 13px; margin: 0 0 2px; color: #e89478; }
  #debug .states { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #debug button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 5px 6px; font-size: 12px; cursor: pointer;
  }
  #debug button:hover { background: #44454f; }
  #debug button.active { background: #c1694f; color: #fff; border-color: #c1694f; }
  #debug button.placeholder { border-style: dashed; }
  #debug label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #debug .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }

  /* the inbox popover: opens above the buddy (into the window's standing
     headroom in Tauri), solid dark panel readable on any wallpaper */
  #popover {
    position: fixed; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #4a453f; border-radius: 12px;
    padding: 10px 12px; font-size: 12px; line-height: 1.35;
    max-height: 330px; overflow-y: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #popover .pop-head {
    font-weight: 600; color: #e89478; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  #popover .mode-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 8px;
    background: #f2c14e; color: #3b2a00;
  }
  #popover .mode-badge[hidden] { display: none; }
  /* how fresh the big brain's last look is; turns amber when it is stale */
  #popover .pop-feed { color: #b9b2ab; font-style: italic; font-size: 11px; margin: -2px 0 6px; }
  #popover .pop-feed.warn { color: #e0a36b; font-style: normal; }
  #popover .pop-quiet { color: #b9b2ab; font-style: italic; font-size: 11px; margin: -2px 0 6px; }
  #popover .sec {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: #8a857f; margin: 8px 0 2px;
  }
  /* source pill: which app an item came from */
  #popover .surface {
    flex: none; font-size: 9px; line-height: 1; padding: 3px 5px; border-radius: 8px;
    background: #3a3f4a; color: #c9d1dc; letter-spacing: .02em;
  }
  #popover .sess { padding: 5px 6px; margin: 0 -6px; border-top: 1px solid #33302c; cursor: pointer; border-radius: 6px; }
  #popover .sec + .sess { border-top: none; }
  #popover .sess:hover { background: rgba(255, 255, 255, .06); }
  body.panels-light #popover .sess:hover { background: rgba(0, 0, 0, .05); }
  #popover .sess.nolink { cursor: default; }
  #popover .sess .top { display: flex; align-items: center; gap: 6px; }
  #popover .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  #popover .proj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover .age { color: #8a857f; margin-left: auto; flex: none; }
  #popover .detail {
    color: #a29c95; margin: 2px 0 0 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #popover .idea {
    color: #c9a15f; margin: 3px 0 0 14px;
    display: flex; align-items: center; gap: 6px;
  }
  #popover .idea span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover .empty { color: #a29c95; padding: 4px 0; }
  /* small in-row buttons: tick it off, talk it over, do it */
  .mini {
    flex: none; font: inherit; font-size: 11px; line-height: 1;
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 3px 7px; cursor: pointer;
  }
  .mini:hover { background: #44454f; }
  .mini.tick { padding: 3px 5px; }
  .mini.doit { background: #f2c14e; color: #3b2a00; border-color: #d49a2a; font-weight: 600; }
  .mini.doit:hover { background: #ffd66e; }

  /* speech bubble: what needs you, readable with zero clicks. Clickable:
     it opens the thing it is about. */
  #bubble {
    position: fixed; cursor: pointer; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #e89478; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; line-height: 1.35;
    max-width: 320px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #bubble:hover { border-color: #ffb08a; }
  #bubble.calm { border-color: #9ab98f; }
  #bubble .b-title { font-weight: 600; color: #e89478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble.calm .b-title { color: #9ab98f; }
  #bubble .b-detail {
    color: #b9b2ab;
    max-height: 300px; overflow: hidden;
    word-break: break-word;
  }
  #bubble .b-act { margin-top: 6px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
  /* tail points DOWN at his head: the bubble sits above him */
  #bubble .b-tail {
    position: absolute; bottom: -6px; left: 50%; margin-left: -6px;
    width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid #e89478;
  }
  #bubble.calm .b-tail { border-top-color: #9ab98f; }

  /* his requests chat: a little thread above him */
  #askbox {
    position: fixed; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #e89478; border-radius: 12px;
    padding: 8px 10px; font-size: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #askbox .ask-log { max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  #askbox .msg { max-width: 88%; padding: 6px 9px; border-radius: 10px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
  #askbox .msg.him { background: #2c2c34; align-self: flex-start; border-bottom-left-radius: 3px; }
  #askbox .msg.you { background: #c1694f; color: #fff3ea; align-self: flex-end; border-bottom-right-radius: 3px; }
  #askbox .msg.typing { color: #b9b2ab; letter-spacing: 2px; }
  #askbox .msg-actions { display: flex; gap: 6px; }
  /* a message about to go to someone: laid out like the real thing */
  #askbox .draft {
    align-self: stretch; background: #f7f4f0; color: #2b2724; border-radius: 10px;
    border: 1px solid #d9d0c6; padding: 8px 10px; font-size: 13px; line-height: 1.4;
  }
  #askbox .draft .d-app { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #8a7f74; margin-bottom: 4px; }
  #askbox .draft .d-field { color: #6f6660; }
  #askbox .draft .d-field b { color: #2b2724; font-weight: 600; }
  #askbox .draft .d-body { margin-top: 6px; padding-top: 6px; border-top: 1px solid #e3dcd4; white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow-y: auto; }
  #askbox .draft .d-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; align-items: center; }
  #askbox .draft .d-actions button { white-space: nowrap; }
  #askbox .draft .send {
    font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; border: none; border-radius: 8px;
    padding: 6px 16px; background: #c1694f; color: #fff;
  }
  #askbox .draft .send:hover { background: #d27a60; }
  #askbox .draft .change { font: inherit; font-size: 12px; cursor: pointer; background: none; border: none; color: #8a7f74; text-decoration: underline; }
  #askbox .draft .d-sent { color: #4c7a3f; font-weight: 700; }
  #askbox input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 14px;
    background: #2a2a31; color: #f1ebe5; border: 1px solid #555; border-radius: 8px;
    padding: 6px 8px; outline: none;
  }
  #askbox input:focus { border-color: #e89478; }
  #askbox .ask-hint { color: #8a857f; font-size: 11px; margin-top: 5px; }
  body.panels-light #askbox .msg.him { background: #ece6df; }
  .mini.go { background: #c1694f; color: #fff3ea; border-color: #c1694f; font-weight: 600; }
  .mini.go:hover { background: #d27a60; }

  /* getting to know you: his question, your answer */
  #chat {
    position: fixed; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #9ab98f; border-radius: 12px;
    padding: 10px 12px; font-size: 13px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #chat .chat-q { font-size: 14px; line-height: 1.35; margin-bottom: 6px; font-weight: 600; }
  #chat .chat-sub { color: #b9b2ab; line-height: 1.35; margin-bottom: 8px; }
  #chat .chat-sub[hidden], #chat .chat-chips[hidden], #chat input[hidden], #chat #chat-hint[hidden] { display: none; }
  #chat .chat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #chat .chip {
    font: inherit; font-size: 12px; cursor: pointer; border-radius: 14px; padding: 4px 10px;
    background: #2c2c34; color: #e6e0da; border: 1px solid #555;
  }
  #chat .chip.on { background: #9ab98f; color: #1d2a18; border-color: #9ab98f; }
  #chat #chat-btns { display: flex; gap: 6px; margin-left: auto; }
  /* inside the egg: the words come through the shell, softer */
  #chat.muffled { border-style: dashed; }
  #chat.muffled .chat-q { font-style: italic; font-weight: 500; }
  body.panels-light #chat .chip { background: #ece6df; color: #3b3630; border-color: #c9beb4; }
  #chat input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 14px;
    background: #2a2a31; color: #f1ebe5; border: 1px solid #555; border-radius: 8px;
    padding: 6px 8px; outline: none;
  }
  #chat input:focus { border-color: #9ab98f; }
  #chat .chat-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: #8a857f; font-size: 11px; }
  #chat .mini[hidden] { display: none; }
  body.panels-light #chat { background: rgba(247, 244, 240, .97); color: #3b3630; border-color: #7f9f73; }
  body.panels-light #chat input { background: #fff; color: #3b3630; border-color: #c9beb4; }

  /* a passing word from him; never clickable */
  #toast {
    position: fixed; box-sizing: border-box; pointer-events: none;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #9ab98f; border-radius: 10px;
    padding: 6px 10px; font-size: 12px; max-width: 300px;
  }

  /* shared circular button family: the "+" and the gear are siblings */
  .round-btn {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; padding: 0; font: inherit;
    position: relative; /* anchors the invisible hit ring */
    background: rgba(22, 22, 27, .96); color: #e89478;
    border: 1px solid #e89478; border-radius: 50%;
    cursor: pointer; user-select: none;
  }
  /* invisible hit rings: a button's pseudo-element is part of its click
     target — the FORGIVING area extends well past the visible circle */
  #gearbtn::before, #newbtn::before, #treatbtn::before {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
  }
  .round-btn:hover { background: #c1694f; color: #fff3ea; }
  /* CRITICAL: display:flex on .round-btn overrides the UA's [hidden] rule */
  .round-btn[hidden] { display: none; }
  /* hover buttons: the "+" (Ask Claw'd) and the treat, as a tiny pair
     centered right below the buddy. ONE positioned element — the row. */
  #petbtns { position: fixed; display: flex; gap: 6px; align-items: center; }
  #petbtns[hidden] { display: none; } /* flex would override [hidden] */
  #newbtn, #treatbtn {
    width: 18px; height: 18px;
    font-size: 13px; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #newbtn.clicked { background: #c1694f; color: #fff3ea; }
  /* the treat glyph is drawn as PIXELS, never an emoji */
  #treatbtn svg { display: block; }
  @keyframes treat-peckish {
    0%, 100% { opacity: 1; }
    50%      { opacity: .5; }
  }
  #treatbtn.peckish { animation: treat-peckish 2s ease-in-out infinite; }
  /* popover gear: text-presentation glyph so it never spills its circle */
  #popover .gear {
    width: 28px; height: 28px; font-size: 15px;
    font-family: 'Segoe UI Symbol', 'Segoe UI', sans-serif;
    margin-left: auto; flex: none;
  }
  #popover .theme-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; align-items: center; }
  #popover .theme-row[hidden] { display: none; } /* flex would override [hidden] */
  #popover .tone-grp { display: flex; gap: 5px; align-items: center; }
  #popover .theme-row .lbl { color: #8a857f; font-size: 11px; margin-right: 2px; }
  #popover .theme-row button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }
  #popover .theme-row button.active.doit { background: #f2c14e; border-color: #d49a2a; color: #3b2a00; }

  /* light theme for the panels */
  body.panels-light #popover, body.panels-light #bubble, body.panels-light #askbox, body.panels-light #toast {
    background: rgba(247, 244, 240, .97); color: #3b3630; border-color: #c9beb4;
  }
  body.panels-light #askbox input { background: #fff; color: #3b3630; border-color: #c9beb4; }
  body.panels-light .round-btn {
    background: rgba(247, 244, 240, .97); color: #b05a3f; border-color: #c1694f;
  }
  body.panels-light .round-btn:hover { background: #c1694f; color: #fff3ea; }
  body.panels-light #popover .pop-head { color: #b05a3f; }
  body.panels-light #popover .sess { border-top-color: #e3dcd4; }
  body.panels-light #popover .age { color: #8a8378; }
  body.panels-light #popover .detail, body.panels-light #popover .empty { color: #6f6862; }
  body.panels-light #popover .idea { color: #8a6420; }
  body.panels-light #popover .pop-feed, body.panels-light #popover .pop-quiet { color: #8a8378; }
  body.panels-light #popover .pop-feed.warn { color: #b0602a; }
  body.panels-light #popover .surface { background: #dfe3ea; color: #4a5260; }
  body.panels-light .mini { background: #e7e0d8; color: #3b3630; border-color: #c9beb4; }
  body.panels-light .mini.doit { background: #f2c14e; color: #3b2a00; border-color: #d49a2a; }
  body.panels-light #popover .theme-row button { background: #e7e0d8; color: #3b3630; border-color: #c9beb4; }
  body.panels-light #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }
  body.panels-light #popover .theme-row button.active.doit { background: #f2c14e; border-color: #d49a2a; color: #3b2a00; }
  body.panels-light #bubble { border-color: #c1694f; }
  body.panels-light #bubble .b-title { color: #b05a3f; }
  body.panels-light #bubble.calm { border-color: #7f9f73; }
  body.panels-light #bubble.calm .b-title { color: #5d7d52; }
  body.panels-light #bubble .b-detail { color: #6f6862; }
  body.panels-light #bubble .b-tail { border-top-color: #c1694f; }
  body.panels-light #bubble.calm .b-tail { border-top-color: #7f9f73; }
</style>
</head>
<body>

<div id="pet-wrap">
  <canvas id="pet-canvas"></canvas>
</div>

<!-- static skeleton: the gear and settings rows are built ONCE and never
     replaced — a rebuilt button under a motionless cursor loses its hover
     state and eats clicks. Only #pop-items contents get re-rendered. -->
<div id="popover" hidden>
  <div class="pop-head">
    <span id="pop-count"></span>
    <span id="pop-mode" class="mode-badge" hidden>ask me first</span>
    <button id="gearbtn" class="gear round-btn" title="settings">&#9881;&#xFE0E;</button>
  </div>
  <div id="pop-feed" class="pop-feed" hidden></div>
  <div id="pop-treats" class="pop-quiet"></div>
  <div id="mode-row" class="theme-row" hidden>
    <span class="lbl">mode:</span>
    <button data-mode="auto" title="When you ask me to do something, I do it right away (anything to another person still waits for your OK)">auto</button>
    <button data-mode="ask" title="I show you my plan first and wait for your go-ahead">ask me first</button>
  </div>
  <div id="theme-row" class="theme-row" hidden>
    <span class="lbl">theme:</span>
    <button data-theme="system">system</button>
    <button data-theme="dark">dark</button>
    <button data-theme="light">light</button>
  </div>
  <div id="start-row" class="theme-row" hidden>
    <span class="lbl">start with Claude:</span>
    <button data-start="on" title="I start when you log in and come out when Claude opens">on</button>
    <button data-start="off" title="I only start when you open me">off</button>
  </div>
  <div id="custom-row" class="theme-row" hidden>
    <button id="custom-btn">customize how I look and sound…</button>
  </div>
  <div id="art-row" class="theme-row" hidden>
    <span class="lbl">skin:</span>
    <button data-art="app">app</button>
    <button data-art="cli">cli</button>
  </div>
  <div id="voice-row" class="theme-row" hidden>
    <span class="lbl">voice:</span>
    <button data-voice="on">on</button>
    <button data-voice="off">off</button>
    <button id="voice-chirp" title="little chirps for small happy moments">chirp</button>
    <button id="voice-test" title="hear it now">test</button>
  </div>
  <!-- one button per installed English voice, filled in once at startup -->
  <div id="voice-pick" class="theme-row" hidden>
    <span class="lbl">who:</span>
  </div>
  <div id="voice-tone" class="theme-row" hidden>
    <span class="tone-grp">
      <span class="lbl">pitch:</span>
      <button data-tone="pitch" data-step="-0.1">&minus;</button>
      <span class="lbl" id="pitch-readout">1.15</span>
      <button data-tone="pitch" data-step="0.1">+</button>
    </span>
    <span class="tone-grp">
      <span class="lbl">speed:</span>
      <button data-tone="rate" data-step="-0.1">&minus;</button>
      <span class="lbl" id="rate-readout">1.00</span>
      <button data-tone="rate" data-step="0.1">+</button>
    </span>
  </div>
  <div id="pop-items"></div>
</div>
<div id="bubble" hidden></div>
<div id="askbox" hidden>
  <div id="ask-log" class="ask-log"></div>
  <input id="ask-input" type="text" maxlength="1000" autocomplete="off" spellcheck="true"
         placeholder="Tell me what you need…">
  <div class="ask-hint">Enter sends. Anything that goes to another person waits for your OK.</div>
</div>
<div id="chat" hidden>
  <div id="chat-q" class="chat-q"></div>
  <div id="chat-sub" class="chat-sub" hidden></div>
  <div id="chat-chips" class="chat-chips" hidden></div>
  <input id="chat-input" type="text" maxlength="300" autocomplete="off" spellcheck="true">
  <div class="chat-row"><span id="chat-hint">Enter to answer</span><span id="chat-btns"></span></div>
</div>
<div id="toast" hidden></div>
<div id="petbtns" hidden>
  <div id="newbtn" class="round-btn" title="Ask me something">+</div>
  <div id="treatbtn" class="round-btn" title="Give Claw'd a treat">
    <svg viewBox="0 0 6 6" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
      <path fill="currentColor" fill-rule="evenodd"
            d="M1 0h4v1h1v4h-1v1h-4v-1h-1v-4h1z M1 2h1v1h-1z M4 2h1v1h-1z M2 3h1v1h-1z"/>
    </svg>
  </div>
</div>

<div id="debug">
  <h1>Claw'd debug</h1>
  <div class="states" id="state-buttons"></div>
  <div class="row"><button id="demo-inbox">demo inbox</button><button id="demo-clear">clear</button></div>
  <div class="row"><span>size: <span id="size-readout">1.00×</span></span>
    <span style="color:#888">(+ / − keys, 0 resets)</span></div>
  <label><input type="checkbox" id="bg-light"> light desk</label>
</div>

<script type="module">
  import { Pet } from './pet.js';
  import { STYLES } from './styles.js';
  import { TreatSprite, FALL_MS } from './treats.js';
  import * as voice from './voice.js';
  import * as persona from './personality.js';
  import { HATCH_MS } from './sprites-egg.js';
  import { createBrain, MODELS, spokenLine, readSummary, readStage, describeSend, readDraft, withoutDraft } from './brain.js';

  const IS_TAURI = !!window.__TAURI__;
  const invoke = IS_TAURI ? window.__TAURI__.core.invoke : null;
  // the big brain: Claude Code, run by him in the background (brain.js)
  const brain = IS_TAURI ? createBrain(invoke, window.__TAURI__.event.listen, { note: persona.brainNote }) : null;
  // page.log in %APPDATA%\ClawdAssistant: every error, plus a short trail of
  // what happened before it (clicks, panels), for machines we can't see
  const trail = [];
  function plog(what) {
    trail.push(new Date().toTimeString().slice(0, 8) + ' ' + what);
    if (trail.length > 12) trail.shift();
  }
  function perr(msg) {
    if (IS_TAURI) invoke('page_log', { line: 'ERROR ' + msg + ' | trail: ' + trail.join(' > ') }).catch(() => {});
  }
  window.addEventListener('error', (e) => perr(`${e.message} at ${e.filename || ''}:${e.lineno || ''}`));
  window.addEventListener('unhandledrejection', (e) => perr('promise: ' + String(e.reason && (e.reason.stack || e.reason))));

  // art style (app mascot / CLI mascot): persisted like the panel theme.
  // The assistant defaults to the CLI buddy: it is the skin the animation
  // series was drawn for first.
  let artStyle = 'cli';
  try { artStyle = localStorage.getItem('artStyle') || 'cli'; } catch {}
  if (!STYLES[artStyle]) artStyle = 'cli';

  // the demo panel's state list follows the active style
  let STATES = Object.keys(STYLES[artStyle].clips);

  // forgiveness halo (CSS px) around the sprite's envelope: part of the OS
  // hit region (reportBounds) AND of the buddy's own press region (onBuddy)
  const HALO = 20;

  // Canvas unit the overhead panels clear: above the TALLEST common frames so
  // they never cover the character. Every overhead panel hangs off this one
  // number so they can never drift apart.
  const SPRITE_CLEAR_UNIT = 52;

  let savedScale = 1.75;
  try { savedScale = parseFloat(localStorage.getItem('petScale')) || 1.75; } catch {}

  const canvas = document.getElementById('pet-canvas');
  const wrap = document.getElementById('pet-wrap');
  const pet = new Pet(canvas, IS_TAURI ? 1 : savedScale, artStyle);

  const popEl = document.getElementById('popover');
  const bubEl = document.getElementById('bubble');
  const askEl = document.getElementById('askbox');
  const askInput = document.getElementById('ask-input');
  const toastEl = document.getElementById('toast');
  const chatEl = document.getElementById('chat');

  // Who he is to you: hatched from his egg yet, and what to call you.
  let hatched = false;
  try { hatched = localStorage.getItem('hatched') === '1'; } catch {}
  let userName = '';
  try { userName = localStorage.getItem('userName') || ''; } catch {}
  voice.setName(userName);

  // --- life on the taskbar (see "Life on the taskbar" below). Declared up
  //     here because the hit-region code reads it. ---
  const FEET_UNIT = 140;   // every clip stands on canvas unit 140, both skins
  const TUCK_UNITS = 38;   // tucked in: sunk this far, his eyes just over the edge
  const life = {
    tb: null,              // taskbar_info from Rust, or null (no taskbar)
    tucked: false, walking: false, busy: false, dragging: false, hovering: false,
    facing: 1,             // 1 right, -1 left (the walk is drawn facing right)
    calmSince: Date.now(), nextPeek: 0, nextStroll: 0,
    tilt: 0, carried: null, lastDisplay: null,
    releaseWalk: null, onArrive: null,
  };
  // true while the launch wave plays: nothing else takes the stage until
  // it hands over (checked as a flag, not as pet.state, because the wave
  // is still 'wave' all through its outro)
  let greeting = true;
  const onTaskbar = () => !!(life.tb && life.tb.on);
  const sinkPx = () => (life.tucked ? TUCK_UNITS * pet.scale : 0);

  function reportBounds() {
    if (!IS_TAURI) return;
    // page-relative: the union of the buddy and every visible panel, so
    // each one gets OS-level clicks while the rest of the window stays
    // click-through
    const b = pet.opaqueBounds();
    const r = wrap.getBoundingClientRect();
    let x = b.x + r.left, y = b.y + r.top + sinkPx();
    let right = x + b.w, bottom = y + b.h;
    // on the taskbar nothing below the line is him: that is the taskbar
    if (onTaskbar()) { bottom = Math.min(bottom, r.bottom); y = Math.min(y, bottom); }
    for (const el of [popEl, btnsEl, bubEl, askEl, chatEl]) {
      if (el.hidden) continue;
      const pr = el.getBoundingClientRect();
      x = Math.min(x, pr.left); y = Math.min(y, pr.top);
      right = Math.max(right, pr.right); bottom = Math.max(bottom, pr.bottom);
    }
    x -= HALO; y -= HALO; right += HALO; bottom += HALO;
    // PHYSICAL px: devicePixelRatio is the exact CSS->physical factor
    const dpr = window.devicePixelRatio || 1;
    invoke('set_opaque_bounds', { x: x * dpr, y: y * dpr, w: (right - x) * dpr, h: (bottom - y) * dpr });
  }

  // --- hover buttons: the "+" (Ask Claw'd) and the treat show together by
  //     the buddy's feet while the cursor is over him ---
  const btnsEl = document.getElementById('petbtns');
  const btnEl = document.getElementById('newbtn');
  const treatBtn = document.getElementById('treatbtn');
  let btnHideTimer = null;

  function showNewBtn() {
    clearTimeout(btnHideTimer);
    btnHideTimer = null;
    // every panel supersedes them, and a meal in progress hides them
    if (!hatched || !btnsEl.hidden || !popEl.hidden || !bubEl.hidden || !askEl.hidden || !chatEl.hidden || feeding) return;
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    treatBtn.classList.toggle('peckish', isPeckish());
    btnsEl.hidden = false;
    if (onTaskbar()) {
      // below him is the taskbar, so the pair sits at his right side
      btnsEl.style.top = (r.bottom - 26) + 'px';
      btnsEl.style.left = (r.left + (rb.x + rb.w) * pet.scale + 8) + 'px';
    } else {
      const feetCss = r.top + (rb.y + rb.h) * pet.scale;
      btnsEl.style.top = (feetCss + 6) + 'px';
      placeCenteredOnBuddy(btnsEl);
    }
    reportBounds();
  }

  function scheduleHideNewBtn() {
    clearTimeout(btnHideTimer);
    btnHideTimer = setTimeout(() => hideBtns(), 1200);
  }

  function hideBtns() {
    clearTimeout(btnHideTimer);
    btnHideTimer = null;
    if (btnsEl.hidden) return;
    btnsEl.hidden = true;
    reportBounds();
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (pet.hitTest(e.clientX - rect.left, e.clientY - rect.top)) showNewBtn();
    else if (!IS_TAURI) scheduleHideNewBtn();
  });
  canvas.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnsEl.addEventListener('mouseenter', () => { clearTimeout(btnHideTimer); btnHideTimer = null; });
  btnsEl.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnEl.addEventListener('click', () => {
    btnEl.classList.add('clicked');
    setTimeout(() => btnEl.classList.remove('clicked'), 300);
    showAsk();
  });
  treatBtn.addEventListener('click', () => feed());

  // --- settings (the gear): mode, panel theme, skin, voice ---
  const popCount = document.getElementById('pop-count');
  const popMode = document.getElementById('pop-mode');
  const popFeed = document.getElementById('pop-feed');
  const popItems = document.getElementById('pop-items');
  const modeRow = document.getElementById('mode-row');
  const themeRow = document.getElementById('theme-row');
  const artRow = document.getElementById('art-row');
  const voiceRow = document.getElementById('voice-row');
  const voicePickRow = document.getElementById('voice-pick');
  const toneRow = document.getElementById('voice-tone');
  const gearBtn = document.getElementById('gearbtn');
  const customRow = document.getElementById('custom-row');
  const startRow = document.getElementById('start-row');
  // the gear: mode, theme, starting with Claude, and one Customize button
  // (skin, voice, pitch and size live in the picker it opens, the same one
  // as during setup)
  const SETTINGS_ROWS = [modeRow, themeRow, startRow, customRow];
  function syncStartButtons(on) {
    startRow.querySelectorAll('button[data-start]').forEach((b) => b.classList.toggle('active', (b.dataset.start === 'on') === on));
  }
  if (IS_TAURI) invoke('get_start_with_claude').then(syncStartButtons).catch(() => {});
  else startRow.remove();
  startRow.querySelectorAll('button[data-start]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const on = b.dataset.start === 'on';
      syncStartButtons(on);
      invoke('set_start_with_claude', { on }).catch(() => {});
      voice.say(on ? 'Okay! I’ll come out whenever Claude does.' : 'Okay, I’ll wait for you to open me.');
    };
  });

  let panelTheme = 'system';
  try { panelTheme = localStorage.getItem('panelTheme') || 'system'; } catch {}
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function applyPanelTheme() {
    const light = panelTheme === 'light' || (panelTheme === 'system' && !darkQuery.matches);
    document.body.classList.toggle('panels-light', light);
  }
  function syncThemeButtons() {
    themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
      b.classList.toggle('active', panelTheme === b.dataset.theme);
    });
  }
  function setPanelTheme(t) {
    panelTheme = t;
    try { localStorage.setItem('panelTheme', t); } catch {}
    applyPanelTheme();
    syncThemeButtons();
  }
  darkQuery.addEventListener('change', () => { if (panelTheme === 'system') applyPanelTheme(); });
  applyPanelTheme();
  syncThemeButtons();
  gearBtn.onclick = (e) => {
    e.stopPropagation();
    const show = themeRow.hidden;
    SETTINGS_ROWS.forEach((r) => { r.hidden = !show; });
    reportBounds();
  };
  document.getElementById('custom-btn').onclick = (e) => { e.stopPropagation(); setPopover(false); customize(); };
  themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setPanelTheme(b.dataset.theme); };
  });

  // --- mode: auto (the default): when you ask him to do something he does
  //     it right away; anything that goes to another person still waits for
  //     your tap. "Ask me first": he shows the plan and waits. ---
  let mode = 'auto';
  try { mode = localStorage.getItem('mode2') === 'ask' ? 'ask' : 'auto'; } catch {}
  function syncModeButtons() {
    modeRow.querySelectorAll('button[data-mode]').forEach((b) => {
      b.classList.toggle('active', mode === b.dataset.mode);
    });
    popMode.hidden = mode !== 'ask';
    pet.setAccessory(null);
  }
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    try { localStorage.setItem('mode2', m); } catch {}
    syncModeButtons();
    voice.say(m === 'auto' ? 'OK! Auto mode is on. When you ask me to do something, I’ll do it right away.'
      : 'OK! I’ll check with you before I do things.');
    renderPopover();
    updateBubble(true);
  }
  syncModeButtons();
  modeRow.querySelectorAll('button[data-mode]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setMode(b.dataset.mode); };
  });

  // --- art style row: swaps the buddy's whole clip set in place ---
  function syncArtButtons() {
    artRow.querySelectorAll('button[data-art]').forEach((b) => {
      b.classList.toggle('active', artStyle === b.dataset.art);
    });
  }
  function setArtStyle(name) {
    if (!STYLES[name]) return;
    artStyle = name;
    try { localStorage.setItem('artStyle', name); } catch {}
    pet.setStyle(name);
    syncArtButtons();
    STATES = Object.keys(pet.style.clips);
    buildStateButtons();
    reportBounds();
  }
  syncArtButtons();
  artRow.querySelectorAll('button[data-art]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setArtStyle(b.dataset.art); };
  });

  // --- voice row ---
  const voiceChirpBtn = document.getElementById('voice-chirp');
  function syncVoiceButtons() {
    const v = voice.get();
    voiceRow.querySelectorAll('button[data-voice]').forEach((b) => {
      b.classList.toggle('active', (b.dataset.voice === 'on') === !!v.enabled);
    });
    voiceChirpBtn.classList.toggle('active', !!v.chirp);
  }
  syncVoiceButtons();
  voiceRow.querySelectorAll('button[data-voice]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const on = b.dataset.voice === 'on';
      voice.set({ enabled: on });
      if (on) voice.warm(); else voice.stop();
      syncVoiceButtons();
    };
  });
  voiceChirpBtn.onclick = (e) => {
    e.stopPropagation();
    const on = !voice.get().chirp;
    voice.set({ chirp: on });
    syncVoiceButtons();
    if (on) voice.chirp(null, 'up');
  };
  // the Test button reads the top item if there is one (with the greeting
  // forced on, so you hear the whole shape), else a sample
  function sampleLine() {
    const top = inbox && inbox.items && inbox.items[0];
    return voice.lineForItem(top || { kind: 'waiting', who: 'Claw’d', title: 'This is what I sound like when I need you.' },
      'new', { forceGreeting: true });
  }
  document.getElementById('voice-test').onclick = (e) => {
    e.stopPropagation();
    voice.say(sampleLine(), { force: true });
  };

  // --- voice picker: one button per installed English voice, built ONCE ---
  let voicePickBuilt = false;
  const shortVoiceName = (n) => n.replace(/^Microsoft\s+/i, '').replace(/\s*[-–(].*$/, '').trim() || n;
  function syncVoicePick() {
    const want = voice.get().voiceName;
    voicePickRow.querySelectorAll('button[data-voice-name]').forEach((b) => {
      b.classList.toggle('active', b.dataset.voiceName === want);
    });
  }
  function buildVoicePick() {
    const list = voice.systemBackend.voices();
    if (voicePickBuilt || !list.length) return;
    voicePickBuilt = true;
    list.slice(0, 8).forEach((v) => {
      const b = document.createElement('button');
      b.dataset.voiceName = v.name;
      b.textContent = shortVoiceName(v.name);
      b.title = v.name;
      b.onclick = (e) => {
        e.stopPropagation();
        voice.set({ voiceName: v.name });
        syncVoicePick();
        voice.say(sampleLine(), { force: true });
      };
      voicePickRow.appendChild(b);
    });
    syncVoicePick();
    reportBounds();
  }
  buildVoicePick();
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.addEventListener('voiceschanged', buildVoicePick);
  }

  // --- tone: pitch and speed, previewed on every press ---
  const pitchReadout = document.getElementById('pitch-readout');
  const rateReadout = document.getElementById('rate-readout');
  function syncTone() {
    const v = voice.get();
    pitchReadout.textContent = Number(v.pitch).toFixed(2);
    rateReadout.textContent = Number(v.rate).toFixed(2);
  }
  syncTone();
  toneRow.querySelectorAll('button[data-tone]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      voice.nudge(b.dataset.tone, parseFloat(b.dataset.step));
      syncTone();
      voice.say(sampleLine(), { force: true });
    };
  });

  // ======================================================================
  // The inbox. Rust (state.rs) keeps the record: items Claude sent, with
  // times already parsed to epoch ms. Everything below turns that record
  // plus the clock into what he does — which clip, what the bubble says,
  // when he speaks — so reminders come due and nudges fire without Claude.
  // ======================================================================

  // hop this long before a meeting starts
  const REMIND_LEAD_MS = 2 * 60 * 1000;
  // ...and say "it's started" once it is this far past
  const LATE_AFTER_MS = 60 * 1000;
  // a new delivery waves its package for this long unless opened sooner
  const FRESH_DELIVERY_MS = 10 * 60 * 1000;
  // nudges per waiting item before he lets it be (it stays in the list)
  const MAX_NUDGES = 3;

  const KIND_RANK = { waiting: 4, reminder: 3, message: 2, delivery: 1, note: 0 };
  const KIND_COLOR = {
    waiting: '#e89478', reminder: '#c9a15f', message: '#8fb3c9', delivery: '#9ab98f', note: '#8a8a8a',
  };
  const SOURCE_LABEL = {
    slack: 'Slack', gcal: 'Calendar', calendar: 'Calendar', gmail: 'Gmail', email: 'Email',
    asana: 'Asana', drive: 'Drive', gdrive: 'Drive', claude: 'Claude',
  };
  const sourceLabel = (it) => SOURCE_LABEL[(it.source || '').toLowerCase()] || it.source || '';

  let inbox = null;          // last payload from Rust
  let derived = null;        // what he is showing, derived from inbox + clock
  const opened = new Set();  // deliveries clicked this run
  let userCleared = false;   // the last change to "waiting" was the user's doing

  // Which items he has already spoken about, so a restart or the next sweep
  // re-sending the same message stays quiet. Per item: `sig` (what was
  // said about), `at` (when), `nudges`, and for reminders `soon` / `late`.
  let announced = {};
  try { announced = JSON.parse(localStorage.getItem('announced') || '{}') || {}; } catch {}
  function saveAnnounced() {
    try { localStorage.setItem('announced', JSON.stringify(announced)); } catch {}
  }
  const sigOf = (it) => `${it.kind}|${it.title}|${it.due_ms || ''}`;

  function fmtAge(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 48) return h + 'h' + (m % 60 ? (m % 60) + 'm' : '');
    return Math.floor(h / 24) + 'd';
  }
  const fmtClock = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function relDue(due, now) {
    const d = due - now;
    if (Math.abs(d) < 60000) return 'now';
    return d > 0 ? 'in ' + fmtAge(d) : fmtAge(-d) + ' late';
  }

  // needs you right now: every open "waiting" item, and a reminder once it
  // is within the lead time (or has no time at all)
  function needsYou(it, now) {
    if (it.handed_off) return false;
    if (it.kind === 'waiting') return true;
    return it.kind === 'reminder' && (it.due_ms == null || now >= it.due_ms - REMIND_LEAD_MS);
  }
  function attentionList(p, now) {
    return p ? p.items.filter((it) => needsYou(it, now)) : [];
  }

  // How fresh Claude's last look is. Stale is his "blind" state: the
  // silent-failure rule from the coding Claw'd — a pet that stopped hearing
  // from Claude must never look peacefully idle.
  function feedStatus(p, now) {
    if (!p) return { stale: false, text: '' };
    if (p.last_heard_ms == null) {
      return { stale: true, text: 'I haven’t heard from the big brain yet.' };
    }
    const gap = now - p.last_heard_ms;
    const quiet = p.quiet_until_ms && now < p.quiet_until_ms;
    if (quiet) return { stale: false, text: `resting until ${fmtClock(p.quiet_until_ms)} · the big brain checked ${fmtAge(gap)} ago` };
    const limit = 2 * Math.max(1, p.sweep_minutes) * 60000 + 60000;
    if (gap > limit) return { stale: true, text: `I haven’t heard from the big brain in ${fmtAge(gap)}` };
    return { stale: false, text: `The big brain checked ${fmtAge(gap)} ago` };
  }

  function derive(p, now) {
    // before he hatches: an egg, which cracks as setup goes (eggState)
    if (!hatched) return { state: eggState(), count: 0 };
    if (!p) return { state: IS_TAURI ? 'sleeping' : 'idle' };
    const att = attentionList(p, now);
    if (att.length) {
      const top = att[0]; // Rust sorts by urgency, then oldest
      return { state: top.kind === 'reminder' ? 'clock' : 'needs_input', top, count: att.length };
    }
    const fresh = p.items.find((it) => it.kind === 'delivery' && !opened.has(it.id)
      && now - it.first_seen_ms < FRESH_DELIVERY_MS);
    if (fresh) return { state: 'package', top: fresh, count: 0 };
    const fs = feedStatus(p, now);
    if (fs.stale) return { state: 'blind', detail: fs.text, count: 0 };
    return { state: 'idle', count: 0 };
  }

  // Put him in the derived state — unless something local is playing (the
  // boot wave, a meal, a flourish), which hands back here when it ends. A
  // calm derived state never wakes a napping crab.
  let flourishing = false;
  function applyDerived() {
    const d = derived;
    if (!d || flourishing || feeding || greeting) return;
    if (d.state === 'idle' && pet.state === 'sleeping') return;
    try { setState(d.state, d.detail || null); } catch (err) { console.error('bad derived state', d, err); }
  }

  // A short local clip (reading, celebrate, happy_wiggle...), then back to
  // the derived state. Never papers over something that needs you, unless
  // `force` (the user just did something and deserves to see it land).
  // How long a clip takes to say its piece: the intro once plus one loop
  // cycle for staged clips, one pass for flat ones. So a drawn animation
  // plays in full, and a retimed one needs no change here.
  function clipMs(name) {
    const c = pet.style.clips[name];
    if (!c) return 0;
    if (c.stages) {
      const sum = (a) => a.reduce((t, s) => t + s.ms, 0);
      return sum(c.stages.intro) + sum(c.stages.loop);
    }
    return Math.round((c.frames.length / (c.fps || 2)) * 1000);
  }

  // the intro alone: how long before a staged clip reaches its loop
  function introMs(name) {
    const c = pet.style.clips[name];
    return c && c.stages ? c.stages.intro.reduce((t, s) => t + s.ms, 0) : 0;
  }

  let flourishToken = 0;
  // Put him in a local clip until the returned release() is called (or a
  // safety cap passes). Returns null when he isn't free for it.
  const HOLD_CAP_MS = 30000;
  function hold(state, force = false) {
    if (!pet.style.clips[state] || feeding || greeting) return null;
    if (!force && derived && derived.state !== 'idle') return null;
    const tok = ++flourishToken;
    flourishing = true;
    setState(state);
    const release = () => {
      if (tok !== flourishToken) return;
      flourishing = false;
      applyDerived();
    };
    setTimeout(release, HOLD_CAP_MS);
    return release;
  }
  // `ms` null = the clip's own length (clipMs), clamped to something sane
  function flourish(state, ms, force = false) {
    if (ms == null) ms = Math.min(9000, Math.max(1000, clipMs(state)));
    const release = hold(state, force);
    if (!release) return false;
    setTimeout(release, ms);
    return true;
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function tick() {
    const now = Date.now();
    const prev = derived;
    const d = derive(inbox, now);
    derived = d;
    const topId = (x) => (x && x.top ? x.top.id : '');
    const changed = !prev || prev.state !== d.state || topId(prev) !== topId(d) || prev.count !== d.count;
    if (changed) {
      applyDerived();
      if (prev && prev.count > 0 && !d.count && userCleared) {
        flourish('celebrate', 2000);
        voice.chirp(null, 'happy');
      }
      userCleared = false;
      renderPopover();
    }
    updateBubble(changed);
    if (voiceArmed) speakTick(now);
    lifeTick(now);
  }

  // ======================================================================
  // Life on the taskbar. When he lives there (the default), his feet stand
  // on the taskbar's top edge and everything below that line is hidden, so
  // he can sink in behind it. Rust knows where the taskbar is and moves the
  // window; this decides what he does:
  //   - something needs you: he's up, out and hopping (as everywhere else)
  //   - all quiet: he walks home (just left of the clock), and after a while
  //     tucks in with only the top of his head showing, and naps
  //   - now and then he peeks up, looks around, and ducks back down
  //   - every few minutes he takes a short stroll and wanders back
  //   - hovering his head pops him up; the tray icon calls him out
  // ======================================================================
  const SETTLE_MS = 20000;          // quiet this long at home before tucking in
  const HOVER_RETUCK_MS = 6000;     // ...but only this long after you hovered
  const HOME_AFTER_MS = 6000;       // quiet this long away from home: walk back
  const PEEK_EVERY = [70000, 180000];
  const STROLL_EVERY = [4 * 60000, 9 * 60000];
  const STROLL_DIST = [150, 520];   // CSS px, scaled to the screen
  // walking pace: the walk clip says how far its stride carries him (canvas
  // units a second), so his feet never slide; this is only the fallback
  const WALK_UNITS_PER_S = 60;
  const TURN_MS = 250;              // the front-facing beat between directions
  const between = ([a, b]) => a + Math.random() * (b - a);

  // canvas transform: sunk while tucked. (Never mirrored: walking left has
  // its own frames, walk_left in styles.js, so he never squashes flat.)
  function applyCanvasTransform() {
    const parts = [];
    if (life.tucked) parts.push(`translateY(${TUCK_UNITS * pet.scale}px)`);
    if (life.tilt) parts.push(`rotate(${life.tilt}deg)`);
    canvas.style.transform = parts.join(' ');
  }

  // On the taskbar the wrap ends at his feet, and overflow is hidden: that
  // edge IS the taskbar's top, so anything lower is behind it.
  function layoutWrap() {
    const on = onTaskbar();
    document.body.classList.toggle('on-taskbar', on);
    wrap.style.height = ((on ? FEET_UNIT : 160) * pet.scale) + 'px';
    wrap.style.bottom = on ? (110 + (160 - FEET_UNIT) * pet.scale) + 'px' : '';
    wrap.style.overflow = on ? 'hidden' : '';
    if (!on) life.tucked = false;
    applyCanvasTransform();
    reportBounds();
    reportAnchor();
  }

  // Tell Rust exactly where his centre and feet are in the window, so
  // standing him on the taskbar lands to the pixel whatever the web view's
  // own offsets are. Physical px from the viewport's top-left.
  function reportAnchor() {
    if (!IS_TAURI) return;
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const dpr = window.devicePixelRatio || 1;
    invoke('report_anchor', {
      x: (r.left + (rb.x + rb.w / 2) * pet.scale) * dpr,
      y: (r.top + FEET_UNIT * pet.scale) * dpr,
      scale: pet.scale,
    });
  }

  // `instant`: no slide, for when a clip does its own rising (the peek) or
  // a drag grabs him
  function setTuck(on, instant = false) {
    on = on && onTaskbar();
    if (on === life.tucked) return;
    canvas.classList.toggle('snap', instant);
    canvas.classList.toggle('tucking', on && !instant);
    life.tucked = on;
    applyCanvasTransform();
    reportBounds();
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.remove('snap')));
  }

  async function refreshTaskbar() {
    if (!IS_TAURI) return;
    try { life.tb = await invoke('taskbar_info'); } catch { life.tb = null; }
    layoutWrap();
    // which display he's on; moving him to another one gets a comment
    if (life.tb) {
      const here = `${life.tb.display}:${life.tb.display_name}`;
      if (life.lastDisplay && here !== life.lastDisplay && hatched && !life.walking) {
        plog('new display ' + here);
        setTimeout(() => voice.say(persona.line('newScreen')), 1400);
      }
      life.lastDisplay = here;
    }
  }

  function lifeTick(now) {
    if (!IS_TAURI || !onTaskbar() || life.dragging || !hatched || !chatEl.hidden) return;
    const tb = life.tb;
    const calm = !!derived && derived.state === 'idle' && popEl.hidden && askEl.hidden
      && !feeding && !life.hovering;
    if (!calm) {
      life.calmSince = now;
      if (life.walking) stopWalking();
      life.busy = false;
      setTuck(false);
      return;
    }
    if (life.walking || life.busy || flourishing) return;
    if (!life.nextStroll) life.nextStroll = now + between(STROLL_EVERY) * persona.traits().life.stroll;
    const away = Math.abs(tb.center_x - tb.home_x) > 8 * tb.sf;
    if (away) {
      if (now - life.calmSince > HOME_AFTER_MS) {
        setTuck(false);
        walkTo(tb.home_x, () => { life.calmSince = Date.now() - SETTLE_MS + 4000; });
      }
      return;
    }
    if (!life.tucked) {
      if (now - life.calmSince > SETTLE_MS * persona.traits().life.settle) {
        setTuck(true);
        life.nextPeek = now + between(PEEK_EVERY) * persona.traits().life.peek;
      }
      return;
    }
    const tr = persona.traits().life;
    if (now > life.nextStroll) { life.nextStroll = now + between(STROLL_EVERY) * tr.stroll; stroll(); return; }
    if (now > life.nextPeek) { life.nextPeek = now + between(PEEK_EVERY) * tr.peek; peekOnce(); }
  }

  // Walk his centre to `x` (physical px). The walk clip plays facing the way
  // he goes; Rust slides the window and says "walk-done" on arrival.
  async function walkTo(x, onArrive) {
    const tb = life.tb;
    if (!tb || life.walking) return false;
    const dir = x < tb.center_x ? -1 : 1;
    const name = dir < 0 && pet.style.clips.walk_left ? 'walk_left' : 'walk';
    // Changing direction: face front for a beat first (his idle frame) so he
    // turns round rather than snapping from one profile to the other.
    if (life.facing !== dir && pet.state !== 'idle') {
      if (!hold('idle')) return false;
      await sleep(TURN_MS);
    }
    const release = hold(name);
    if (!release) return false;
    life.facing = dir;
    life.walking = true;
    life.releaseWalk = release;
    life.onArrive = onArrive || null;
    const clip = pet.style.clips.walk;
    const speed = ((clip && clip.travel) || WALK_UNITS_PER_S) * pet.scale * tb.sf; // physical px/s
    try { await invoke('walk_to', { centerX: x, speed }); } catch { finishWalk(false); }
    return true;
  }

  function finishWalk(arrived) {
    if (!life.walking) return;
    life.walking = false;
    const release = life.releaseWalk;
    const then = life.onArrive;
    life.releaseWalk = null;
    life.onArrive = null;
    if (release) release();
    refreshTaskbar().then(() => { if (arrived && then) then(); });
  }

  function stopWalking() {
    invoke('stop_walk');
    finishWalk(false);
  }

  // up, a little way along the bar, a look around, and back home
  function stroll() {
    const tb = life.tb;
    if (!tb) return;
    life.busy = true;
    setTuck(false);
    const dist = between(STROLL_DIST) * tb.sf * (Math.random() < 0.8 ? -1 : 1); // mostly away from the clock
    const target = Math.max(tb.min_x, Math.min(tb.max_x, tb.home_x + dist));
    setTimeout(() => {
      if (!life.busy) return; // something needed him meanwhile
      walkTo(target, () => {
        // look around a moment (sometimes with a happy wiggle), then home
        if (Math.random() < 0.5) flourish('happy_wiggle', null);
        setTimeout(() => {
          if (!life.busy) return;
          walkTo(life.tb ? life.tb.home_x : target, () => {
            life.busy = false;
            life.calmSince = Date.now() - SETTLE_MS + 3000;
          });
        }, between([2500, 5000]));
      });
    }, 600);
  }

  // --- picked up and put down ---------------------------------------
  // Grabbed: he flails, dangling and swinging, with a surprised "whee!".
  // Let go: he doesn't land on his feet. He topples onto his side with an
  // "oof", lies there a beat, then gets up, shakes himself off, and chirps
  // like nothing happened. (The egg just gets rocked, and rocks back.)
  function pickUp() {
    plog('picked up');
    if (!hatched) { voice.chirp(null, 'muffled'); return; }
    if (life.carried) life.carried();
    life.carried = hold('held', true);
    voice.chirp(4, 'up');
  }

  const sleepFor = (ms) => new Promise((r) => setTimeout(r, ms));
  async function putDown() {
    if (!hatched) return;
    const release = life.carried;
    life.carried = null;
    if (release) release();
    const fall = hold('idle', true);
    // topple: a quick fall onto his side, pivoting on his feet
    canvas.style.transformOrigin = `50% ${FEET_UNIT / 160 * 100}%`;
    canvas.style.transition = 'transform .16s ease-in';
    life.tilt = Math.random() < 0.5 ? -88 : 88;
    applyCanvasTransform();
    await sleepFor(170);
    voice.chirp(2, 'flat'); // oof
    await sleepFor(650);
    // back up, with a little bounce
    canvas.style.transition = 'transform .3s cubic-bezier(.34, 1.56, .64, 1)';
    life.tilt = 0;
    applyCanvasTransform();
    await sleepFor(320);
    canvas.style.transition = '';
    // and shake it off
    if (fall) fall();
    const shake = hold('shake_off', true);
    voice.chirp(null, 'light');
    await sleepFor(550);
    if (shake) shake();
    voice.chirp(null, 'happy');
  }

  // rise up from behind the bar (the peek clip does its own rising), look
  // about, and sink back
  function peekOnce() {
    if (!pet.style.clips.peek || pet.style.clips.peek.placeholderFor) return;
    life.busy = true;
    setTuck(false, true);
    if (!flourish('peek', null)) { setTuck(true, true); life.busy = false; return; }
    setTimeout(() => {
      if (life.busy && derived && derived.state === 'idle') setTuck(true, true);
      life.busy = false;
    }, Math.min(9000, Math.max(1000, clipMs('peek'))));
  }

  // the tray icon (or its "Call Claw'd"): up, out, and a happy hello
  function summon() {
    life.calmSince = Date.now();
    setTuck(false);
    if (!flourish('happy_wiggle', null, true)) setState('idle');
    voice.chirp(null, 'light');
  }

  // ======================================================================
  // Onboarding: the egg, setup inside him, hatching, his first words.
  // The script is Nat's (docs: the onboarding walkthrough in the plan):
  //   A  an egg by the clock, still and silent
  //   B  click: a muffled questioning chirp, "It seems cramped in here…"
  //   C  [Let's get started]: can he reach the big brain? (log in / say yes
  //      to its apps / fall back to pasting a setup message into Claude)
  //   D  silent setup chat in his bubble: what would you like my help with?
  //      then the big brain sets him up, and the egg cracks with each stage
  //   E  fully cracked: "I think I'm ready… Click me!"
  //   F  your click hatches him: hello, your name, your work besties
  //   G  what the big brain found out
  //   H  "Yay! I'm going to go get settled in…", then his first check
  // Until he hatches, everything he says is text in his bubble plus muffled
  // chatter: his words only come out once he's out of the shell.
  // ======================================================================
  const chatQ = document.getElementById('chat-q');
  const chatSub = document.getElementById('chat-sub');
  const chatChips = document.getElementById('chat-chips');
  const chatInput = document.getElementById('chat-input');
  const chatBtns = document.getElementById('chat-btns');
  const chatHint = document.getElementById('chat-hint');

  // setup progress, kept across restarts:
  //   stage: egg | running | ready | hatched;  crack: 0..3;  summary: {…}
  let setup = { stage: 'egg', crack: 0, summary: null };
  try { setup = { ...setup, ...(JSON.parse(localStorage.getItem('setup') || 'null') || {}) }; } catch {}
  if (hatched) setup.stage = 'hatched';
  if (setup.stage === 'running') setup.stage = 'egg'; // a setup cut short by a restart starts over
  const saveSetup = () => { try { localStorage.setItem('setup', JSON.stringify(setup)); } catch {} };
  let eggChecking = false; // the gentle rock while he looks for the big brain

  // which egg to show; derive() asks
  function eggState() {
    if (setup.stage === 'ready') return 'egg_ready';
    // set up the other way (a Claude chat followed SETUP.md): he's ready too
    // (unless you chose Start over: then setup runs inside him, from scratch)
    if (setup.stage === 'egg' && !setup.fresh && inbox && inbox.last_heard_ms != null && !brainOk) return 'egg_ready';
    if (setup.crack >= 3) return 'egg_ready';
    if (setup.crack === 2) return 'egg_crack2';
    if (setup.stage === 'running') return 'egg_crack1';
    return eggChecking ? 'egg_rock' : 'egg';
  }

  // whether the big brain has ever worked here (setup inside him, and his
  // own timer, depend on it)
  let brainOk = false;
  try { brainOk = localStorage.getItem('brainOk') === '1'; } catch {}
  const setBrainOk = (v) => { brainOk = v; try { localStorage.setItem('brainOk', v ? '1' : '0'); } catch {} };

  // "call me Nat!" / "I'm Nat." / "my name is nat" -> "Nat"
  function cleanName(raw) {
    let n = String(raw || '').trim()
      .replace(/^(you can |please )?(call me|i'?m|i am|my name is|it'?s|name'?s)\s+/i, '')
      .replace(/[.!?,;:]+$/, '').trim();
    if (n.length > 40) n = n.slice(0, 40);
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
  }

  function setUserName(n) {
    userName = n || '';
    try { if (userName) localStorage.setItem('userName', userName); else localStorage.removeItem('userName'); } catch {}
    voice.setName(userName);
  }

  // --- his bubble as a little form: a question, chips, a text box, buttons.
  //     Resolves with { button, chips, text }, or null if closed. ---
  let panelResolve = null;
  function placeChat() {
    placeCenteredOnBuddy(chatEl, Math.min(330, window.innerWidth - 16));
    chatEl.style.bottom = aboveBuddyBottomCss(10);
  }
  function panel({ title, sub = '', chips = null, multi = false, other = false, input = false,
    placeholder = '', buttons = [], skip = false, muffled = false, speak = null,
    selected = [], onChip = null } = {}) {
    return new Promise((resolve) => {
      if (panelResolve) panelResolve(null);
      panelResolve = resolve;
      setPopover(false);
      closeAsk();
      chatEl.hidden = false;
      chatEl.classList.toggle('muffled', !!muffled);
      chatQ.textContent = title;
      chatSub.textContent = sub;
      chatSub.hidden = !sub;
      // chips: tap to pick (several, if multi)
      chatChips.textContent = '';
      const picked = new Set();
      let otherOn = false;
      for (const c of chips || []) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = c;
        if (selected.includes(c)) { picked.add(c); b.classList.add('on'); }
        b.onclick = (e) => {
          e.stopPropagation();
          if (!multi) { picked.clear(); chatChips.querySelectorAll('.chip').forEach((x) => x.classList.remove('on')); }
          if (picked.has(c) && multi) { picked.delete(c); b.classList.remove('on'); } else { picked.add(c); b.classList.add('on'); }
          if (onChip) onChip(c, picked.has(c));
        };
        chatChips.appendChild(b);
      }
      if (other) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = 'Something else…';
        b.onclick = (e) => {
          e.stopPropagation();
          otherOn = !otherOn;
          b.classList.toggle('on', otherOn);
          chatInput.hidden = !otherOn;
          if (otherOn) setTimeout(() => chatInput.focus(), 0);
          placeChat(); reportBounds();
        };
        chatChips.appendChild(b);
      }
      chatChips.hidden = !(chips || other);
      chatInput.hidden = !input;
      chatInput.value = '';
      chatInput.placeholder = placeholder;
      chatHint.hidden = !input;
      const answer = (button) => {
        const text = chatInput.value.trim();
        const all = [...picked];
        if (other && otherOn && text) all.push('Something else: ' + text);
        finishPanel({ button, chips: all, text });
      };
      chatBtns.textContent = '';
      const list = [...buttons];
      if (skip) list.push({ label: 'Skip', skip: true });
      for (const bt of list) {
        const b = document.createElement('button');
        b.className = 'mini' + (bt.primary ? ' go' : '');
        b.textContent = bt.label;
        b.onclick = (e) => { e.stopPropagation(); answer(bt.skip ? 'Skip' : bt.label); };
        chatBtns.appendChild(b);
      }
      chatInput.onkeydown = (e) => {
        if (e.key === 'Escape') { finishPanel(null); return; }
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (!chatInput.value.trim() && !(chips || other)) return;
        // Enter is always "here is my answer": never Skip, even when Skip is
        // the only button
        answer((list.find((b) => b.primary) || { label: 'OK' }).label);
      };
      placeChat();
      updateBubble(true);
      reportBounds();
      if (muffled) voice.babble(title + ' ' + sub);
      else if (speak) voice.say(speak);
      if (input) setTimeout(() => chatInput.focus(), 0);
    });
  }
  function finishPanel(ans) {
    const r = panelResolve;
    panelResolve = null;
    closeChat();
    if (r) r(ans);
  }
  // a line with nothing to answer (progress, "I'll wait right here")
  let lastNote = null;
  function note(title, sub = '', muffled = !hatched) {
    lastNote = { title, sub, muffled };
    panel({ title, sub, muffled });
  }
  // change the second line of what he's showing, quietly
  function noteSub(sub) {
    if (chatEl.hidden || !lastNote) return;
    lastNote = { ...lastNote, sub };
    chatSub.textContent = sub;
    chatSub.hidden = !sub;
    placeChat();
    reportBounds();
  }
  function closeChat() {
    if (chatEl.hidden) return;
    chatEl.hidden = true;
    updateBubble(true);
    reportBounds();
  }

  // say a line out loud and wait for him to finish it
  async function sayAndWait(text) {
    showToast(text); // his words on screen too, whether or not his voice is on
    let release = null;
    try {
      await voice.say(text);
      // the talking pose starts a beat after his voice, like the bob
      await sleep(120);
      if (hatched && !flourishing && voice.isSpeaking()) release = hold('talk');
      await sleep(180);
      for (let t = 0; voice.isSpeaking() && t < 20000; t += 150) await sleep(150);
    } finally { if (release) release(); }
    await sleep(250);
  }

  // what intro.json holds so far, merged and saved for the big brain
  let introRecord = {};
  async function saveIntro(patch) {
    introRecord = { version: 2, ...introRecord, ...patch, updated_at: new Date().toISOString() };
    if (IS_TAURI) await invoke('save_intro', { json: JSON.stringify(introRecord) });
  }

  const listNames = (names) => names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];

  // --- How should I sound (and how big should I be)? During setup, in the
  //     egg, and any time from the gear's Customize button. Every tap
  //     previews: a sample line, or him growing and shrinking. ---
  const SAMPLE = 'Hi! This is how I’d sound. What do you think?';
  const STYLES_SOUND = ['My words', 'Animalese only', 'No sound'];
  const PITCHES = [['Lower', 1.4], ['Normal', 1.8], ['Higher', 2.0]];
  const A_PITCHES = [['Super deep', 'deep'], ['Normal', 'normal'], ['High', 'high']];
  const SIZES = [['Small', 1.0], ['Medium', 1.4], ['Big', 1.75], ['Huge', 2.3]];
  const shortVoice = (n) => n.replace(/^Microsoft\s+/i, '').replace(/\s*[-–(].*$/, '').trim() || n;
  const nearest = (list, v) => list.reduce((b, x) => (Math.abs(x[1] - v) < Math.abs(b[1] - v) ? x : b))[0];

  async function customize({ inEgg = false } = {}) {
    const v = voice.get();
    const current = !v.enabled ? 'No sound' : v.style === 'animalese' ? 'Animalese only' : 'My words';
    const setStyle = (c) => {
      if (c === 'No sound') { voice.stop(); voice.set({ enabled: false }); return; }
      voice.set({ enabled: true, style: c === 'Animalese only' ? 'animalese' : 'words' });
      voice.say(SAMPLE);
    };
    const style = await panel({ title: 'How should I sound?', sub: 'Tap one to hear it.', chips: STYLES_SOUND,
      selected: [current], onChip: setStyle, buttons: [{ label: 'Next', primary: true }], muffled: inEgg });
    if (!style) return;
    const soundOn = voice.get().enabled;

    if (soundOn && voice.get().style !== 'animalese') {
      const list = voice.systemBackend.voices().slice(0, 8);
      if (list.length > 1) {
        const names = list.map((x) => shortVoice(x.name));
        const chosen = list.find((x) => x.name === voice.get().voiceName);
        await panel({ title: 'Which voice is me?', sub: 'Tap to hear each one.', chips: names,
          selected: chosen ? [shortVoice(chosen.name)] : [],
          onChip: (c) => { const x = list[names.indexOf(c)]; if (x) { voice.set({ voiceName: x.name }); voice.say(SAMPLE); } },
          buttons: [{ label: 'Next', primary: true }], muffled: inEgg });
      }
    }
    if (soundOn && voice.get().style === 'animalese') {
      await panel({ title: 'How high is my voice?', chips: A_PITCHES.map((p) => p[0]),
        selected: [(A_PITCHES.find((p) => p[1] === voice.get().animalesePitch) || A_PITCHES[1])[0]],
        onChip: (c) => { voice.set({ animalesePitch: A_PITCHES.find((p) => p[0] === c)[1] }); voice.say(SAMPLE); },
        buttons: [{ label: 'Next', primary: true }], muffled: inEgg });
    } else if (soundOn) {
      await panel({ title: 'How high is my voice?', chips: PITCHES.map((p) => p[0]),
        selected: [nearest(PITCHES, voice.get().pitch)],
        onChip: (c) => { voice.set({ pitch: PITCHES.find((p) => p[0] === c)[1] }); voice.say(SAMPLE); },
        buttons: [{ label: 'Next', primary: true }], muffled: inEgg });
    }
    await panel({ title: 'How big should I be?', sub: 'I’ll try each size on.', chips: SIZES.map((x) => x[0]),
      selected: [nearest(SIZES, pet.scale)],
      onChip: (c) => { resizeTo(SIZES.find((x) => x[0] === c)[1]); setTimeout(placeChat, 250); },
      buttons: [{ label: inEgg ? 'Next' : 'Done', primary: true }], muffled: inEgg });
    if (!inEgg) {
      await panel({ title: 'And my look?', chips: ['Terminal (CLI)', 'App'],
        selected: [artStyle === 'cli' ? 'Terminal (CLI)' : 'App'],
        onChip: (c) => setArtStyle(c === 'App' ? 'app' : 'cli'),
        buttons: [{ label: 'Done', primary: true }] });
      voice.chirp(null, 'happy');
    }
  }

  // --- B: you click the egg ---
  let eggAsked = false;
  let setupBusy = false;
  function clickEgg() {
    if (eggState() === 'egg_ready' && setup.stage !== 'running') { voice.chirp(null, 'excited'); hatchNow(); return; }
    if (setupBusy) {
      voice.chirp(null, 'muffled');
      // whatever he's busy with stays up; if its bubble was closed, bring it back
      if (chatEl.hidden && panelResolve === null && lastNote) note(lastNote.title, lastNote.sub, lastNote.muffled);
      return;
    }
    if (eggAsked) {
      voice.chirp(null, 'muffled');
      note('Hello? Is anybody out there?');
      setTimeout(() => { eggAsked = false; }, 4000);
      return;
    }
    eggAsked = true;
    voice.chirp(null, 'muffled');
    startSetup();
  }

  async function startSetup() {
    const go = await panel({ title: 'It seems cramped in here…', sub: 'Can you help me get out?',
      buttons: [{ label: 'Let’s get started', primary: true }], muffled: true });
    if (!go) { eggAsked = false; return; }
    setupBusy = true;
    try { await runSetup(); } finally { setupBusy = false; eggAsked = false; }
  }

  // --- C: can he reach the big brain? ---
  async function reachBrain() {
    for (;;) {
      eggChecking = true; tick();
      note('Let me see if I can reach the big brain…');
      const slow = setTimeout(() => {
        if (lastNote && lastNote.title.startsWith('Let me see')) note('Let me see if I can reach the big brain…', 'This can take a little while the first time.');
      }, 12000);
      let st;
      try { st = await brain.status(); } catch { st = { found: false, ready: false, problem: 'not-found', servers: [] }; }
      clearTimeout(slow);
      eggChecking = false; tick();
      if (st.ready) { setBrainOk(true); return st; }
      if (!st.found) {
        const r = await panel({ title: 'Hmm, I can’t reach the big brain from in here.',
          sub: 'Open the Claude app, start a new chat, and paste my setup message. The big brain will know what to do.',
          buttons: [{ label: 'Copy my setup message', primary: true }], muffled: true });
        if (!r) return null;
        const msg = `Please set up Claw’d for me. Follow SETUP.md in my Clawd folder (${inbox ? inbox.inbox_dir.replace(/[\\/]inbox$/, '') : '%USERPROFILE%\\Clawd'}).`;
        try { await navigator.clipboard.writeText(msg); } catch {}
        note('Copied! I’ll wait right here.');
        return null;
      }
      if (st.problem === 'not-logged-in') {
        const r = await panel({ title: 'The big brain doesn’t know who you are yet.',
          sub: 'Can you log me in? It only takes a second.', buttons: [{ label: 'Log me in', primary: true }], muffled: true });
        if (!r) return null;
        brain.open('login');
        const done = await panel({ title: 'A window just opened for the big brain.',
          sub: 'Log in there, then come back and tell me!', buttons: [{ label: 'I’m logged in', primary: true }], muffled: true });
        if (!done) return null;
        continue;
      }
      const r = await panel({ title: 'The big brain isn’t answering right now.', sub: 'Let’s try again in a minute.',
        buttons: [{ label: 'Try again', primary: true }], muffled: true });
      if (!r) return null;
    }
  }

  // --- D: what would you like my help with? (silent: bubble text only)
  //     The chips come from the apps the big brain can actually reach, and
  //     he reacts to every tap in his bubble, so it feels like he's
  //     listening. With nothing to go on, the fixed list. ---
  const USES = [
    ['Keeping up with messages', 'messages'],
    ['My meetings and calendar', 'calendar'],
    ['Reminders for little things', 'reminders'],
    ['A morning rundown', 'rundown'],
    ['Tasks and deadlines', 'tasks'],
  ];
  // his reaction in the bubble for a moment, with a little muffled chirp
  async function eggReact(text, ms = 1900) {
    if (!text) return;
    voice.chirp(null, 'muffled');
    note(text);
    await sleep(ms);
  }
  async function askUses(st) {
    const found = persona.intakeChips(st && st.servers);
    const chips = found.length > 2 ? found : USES.map(([label, use]) => ({ label, use }));
    const title = found.length > 2 ? persona.introLine(found) : 'What would you like my help with?';
    const r = await panel({ title, sub: 'Tap all that fit.',
      chips: chips.map((c) => c.label), multi: true, other: true, input: false,
      placeholder: 'Tell me what else…', buttons: [{ label: 'That’s it', primary: true }], muffled: true,
      onChip: (label, on) => {
        if (!on) return;
        const c = chips.find((x) => x.label === label);
        if (!c) return;
        voice.chirp(2, 'muffled');
        chatSub.textContent = persona.reactToUse(c.use, c);
        chatSub.hidden = false;
        placeChat(); reportBounds();
      } });
    if (!r) return null;
    const otherText = (r.chips.find((c) => c.startsWith('Something else: ')) || '').replace('Something else: ', '');
    const uses = r.chips.map((label) => {
      const c = chips.find((x) => x.label === label);
      return c ? c.use : label;
    });
    const out = { uses, apps: chips.filter((c) => uses.includes(c.use) && (c.apps || c.app)).map((c) => c.apps || c.app) };
    await eggReact(persona.reactToUses(uses, otherText), otherText ? 2400 : 1700);
    if (uses.includes('messages')) {
      const m = await panel({ title: 'Which messages matter most?', chips: ['DMs', 'Mentions', 'A few channels'], multi: true,
        input: true, placeholder: 'Which channels? (optional)', buttons: [{ label: 'OK', primary: true }], muffled: true });
      if (m) {
        out.messages_focus = { kinds: m.chips, channels: m.text };
        await eggReact(persona.reactToFocus(m.chips, m.text));
      }
    }
    if (uses.includes('rundown')) {
      const t = await panel({ title: 'What time should your rundown be ready?',
        sub: 'Leave it blank and I’ll have it ready 15 minutes after your day starts.',
        input: true, placeholder: 'e.g. 8:45', buttons: [{ label: 'OK', primary: true }], muffled: true });
      if (t && t.text) out.rundown_time = t.text;
      if (t) await eggReact(persona.reactToRundown(t.text));
    }
    return out;
  }

  // apps the big brain can see but hasn't been given the OK for yet
  async function okApps(st) {
    const needs = (st.servers || []).filter((s) => s.status === 'needs-auth').map((s) => s.name);
    if (!needs.length) return;
    const r = await panel({ title: `The big brain needs your OK to use ${listNames(needs)}.`,
      sub: 'A window will open. Pick each app there, choose Authenticate, then come back.',
      buttons: [{ label: 'Open it', primary: true }, { label: 'Skip for now' }], muffled: true });
    if (!r || r.button !== 'Open it') return;
    brain.open('apps');
    await panel({ title: 'Tell me when you’re done!', buttons: [{ label: 'All done', primary: true }], muffled: true });
  }

  const STAGE_TEXT = ['', 'Getting to know how you work…', 'Setting up what you picked…', 'Almost ready…'];
  // what the big brain is looking at right now, from the tool it's using
  function toolWords(tool) {
    const t = String(tool || '').toLowerCase();
    if (/calendar|gcal|event/.test(t)) return 'Peeking at your calendar…';
    if (/slack|teams|chat/.test(t)) return 'Looking through your messages…';
    if (/gmail|mail|outlook/.test(t)) return 'Skimming your email…';
    if (/granola|otter|fireflies|meeting|transcript/.test(t)) return 'Reading your meeting notes…';
    if (/asana|linear|jira|task|todo/.test(t)) return 'Checking your tasks…';
    if (/drive|docs|notion|file|confluence/.test(t)) return 'Looking at your docs…';
    if (/^(write|edit)$/.test(t)) return 'Writing down what I learned…';
    if (/^(read|glob|grep)$/.test(t)) return 'Reading my notes…';
    return 'Thinking…';
  }

  async function runSetup() {
    if (!brain) return;
    const st = await reachBrain();
    if (!st) return;
    const picks = await askUses(st);
    if (!picks) return;
    await saveIntro(picks);
    await customize({ inEgg: true });
    await okApps(st);
    for (;;) {
      setup = { stage: 'running', crack: 0, summary: null };
      saveSetup(); tick();
      voice.crack(1);
      note(STAGE_TEXT[1]);
      // a long quiet stretch is the big brain reading, not him being stuck
      let lastEventAt = Date.now();
      const patience = setInterval(() => {
        if (Date.now() - lastEventAt > 40000) noteSub('This part takes a minute…');
      }, 10000);
      const r = await brain.run({
        prompt: `Job: setup\nNow: ${new Date().toString()}`,
        model: MODELS.main,
        maxTurns: 60,
        onEvent: (ev) => {
          lastEventAt = Date.now();
          if (ev.kind === 'tool') { noteSub(toolWords(ev.text)); return; }
          if (ev.kind !== 'text') return;
          const n = readStage(ev.text);
          if (n > setup.crack) {
            setup.crack = Math.min(3, n);
            saveSetup(); tick();
            voice.crack(setup.crack);
            note(STAGE_TEXT[setup.crack] || STAGE_TEXT[3]);
          }
        },
      });
      clearInterval(patience);
      if (!r.is_error) {
        setup = { stage: 'ready', crack: 3, summary: readSummary([...r.texts, r.text]) || {} };
        saveSetup(); tick();
        break;
      }
      const again = await panel({ title: 'Oops, something went wrong while the big brain was setting me up.',
        buttons: [{ label: 'Try again', primary: true }], muffled: true });
      if (!again) { setup = { stage: 'egg', crack: 0, summary: null }; saveSetup(); tick(); return; }
    }
    // E: ready to hatch
    voice.chirp(null, 'excited');
    note('I think I’m ready…', 'Click me!');
  }

  // --- F: your click hatches him ---
  let hatching = false;
  function hatchNow() {
    if (hatched || hatching) return;
    hatching = true;
    closeChat();
    bubEl.hidden = true;
    setTuck(false, true);
    const release = hold('hatch', true);
    setTimeout(() => voice.crack(2), 150);
    setTimeout(() => voice.crack(3), HATCH_MS - 700);
    setTimeout(() => voice.chirp(null, 'happy'), HATCH_MS - 300);
    setTimeout(async () => {
      hatched = true;
      hatching = false;
      setup.stage = 'hatched';
      saveSetup();
      try { localStorage.setItem('hatched', '1'); } catch {}
      if (release) release();
      derived = null;
      tick();
      flourish('wave', 1800, true);
      await sleep(500);
      firstWords();
    }, HATCH_MS);
  }

  async function firstWords() {
    await sayAndWait(persona.line('hello'));
    voice.chirp(null, 'light');
    await sleep(500);
    // his name for you: the one thing he has to know
    let name = '';
    while (!name) {
      const ask = persona.line('askName');
      const r = await panel({ title: ask, input: true, placeholder: 'Your name', speak: ask });
      if (!r) { await sleep(800); continue; }
      name = cleanName(r.text);
    }
    setUserName(name);
    await saveIntro({ name });
    await sayAndWait(persona.reactToName(name));
    const askB = persona.line('askBesties');
    const b = await panel({ title: askB, input: true, placeholder: 'e.g. Miguel, Bridgett',
      skip: true, speak: askB });
    const besties = b && b.button !== 'Skip' ? b.text : '';
    if (besties) {
      await saveIntro({ besties });
      flourish('hearts', null, true);
      await sayAndWait(persona.reactToBesties(besties));
    }
    const bestiesDone = brainOk ? brain.run({ prompt: 'Job: besties', model: MODELS.main, maxTurns: 25 }).then(loadPrefs) : Promise.resolve();
    // G: what the big brain found out
    const s = setup.summary || {};
    if (s.hours) {
      await sayAndWait(`Here’s what the big brain found out: you work ${s.hours}`
        + (s.rundown ? `, and I’ll give you a rundown every morning at ${s.rundown}.` : '.'));
    }
    for (const m of (s.missing || []).slice(0, 2)) {
      await sayAndWait(`To help with ${m.use}, I’ll need ${m.app}. You can connect it in the Claude app whenever you like!`);
    }
    await sayAndWait(persona.line('fixIt'));
    // H: settling in
    await sayAndWait(persona.line('settle', { name }));
    voice.chirp(null, 'happy');
    life.calmSince = Date.now() - SETTLE_MS + 8000;
    await loadPrefs();
    if (brainOk) bestiesDone.then(firstCheck);
  }

  async function firstCheck() {
    for (let t = 0; brain.busy && t < 120; t++) await sleep(1000); // wait our turn
    const r = await runSweep();
    if (!r || r.is_error) return;
    await sleep(3000); // let the items land
    const now = Date.now();
    const waiting = attentionList(inbox, now).length;
    const meetings = inbox ? inbox.items.filter((it) => it.kind === 'reminder' && it.source === 'gcal').length : 0;
    const bits = [];
    if (meetings) bits.push(`you’ve got ${meetings === 1 ? 'a meeting' : meetings + ' meetings'} coming up`);
    if (waiting) bits.push(`${waiting === 1 ? 'one thing needs' : waiting + ' things need'} you`);
