[package]
name = "clawd-assistant"
version = "0.3.0"
description = "Claw'd the assistant: a desktop pet your Claude keeps up to date"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# times on inbox items (due, expires): RFC 3339, or local time without offset
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
# direct access to the WebView2 settings object (already a tauri dependency)
# to switch off browser accelerator keys on the pet window
webview2-com = "0.38"
# GetAsyncKeyState for the app-driven drag (tao already builds that feature),
# the foreground-window check, and ShellExecuteW for opening links without
# going through cmd (whose metacharacters make a URL with "&" unsafe)
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSEvent.pressedMouseButtons: is the button still down during a drag
# (the same crate and version tauri already uses)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder"] }

[features]
# enabled for production builds (cargo build --release --features custom-protocol):
# embeds ../src into the exe instead of loading the dev server's devUrl
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
