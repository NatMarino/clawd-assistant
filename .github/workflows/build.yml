# Builds and tests the pet on every push, on Windows and on macOS (so a
# Mac-only compile error shows up here, not on a coworker's laptop). The
# Windows exe is uploaded as a short-lived artifact; release.yml makes the
# downloadable ones.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Build release exe
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: clawd-assistant-exe
          path: src-tauri/target/release/clawd-assistant.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol
