# Cuts a downloadable release: push a tag (git tag v0.2.0 && git push origin
# v0.2.0) and this builds the Windows installer and exe, the Mac .dmg (one
# build for Apple silicon and Intel), zips the clawd skill, and attaches it
# all to a GitHub Release. A tag with a suffix (v0.2.0-beta.1) is a test build:
# a pre-release, never the "latest" that SETUP.md and coworkers download.
#
# Nothing is signed. Windows: SmartScreen warns ("More info" -> "Run anyway").
# Mac: open it once, then System Settings -> Privacy & Security -> Open Anyway
# (right-click -> Open no longer works on macOS 15+).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build exe + installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/clawd-assistant.exe dist/ -Force
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          Compress-Archive -Path skill/clawd -DestinationPath dist/clawd-skill.zip -Force
          Copy-Item SETUP.md dist/ -Force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Setting it up:** install it, click the egg, and he sets himself up.
            (If he can't reach Claude Code, he'll ask you to paste his setup
            message into Claude, which uses `SETUP.md`.)

            **Windows 11**
            - `ClawdAssistant_*_x64-setup.exe`: the installer (per-user, no admin)
            - `clawd-assistant.exe`: the same pet with no installer
            - Unsigned: SmartScreen shows "Windows protected your PC". Click
              *More info*, then *Run anyway*.

            **macOS 11 or later** (Apple silicon and Intel)
            - `ClawdAssistant_*_universal.dmg`: open it, drag Claw'd to Applications
            - Unsigned: open it once and macOS refuses. Click **Done**, then System
              Settings → Privacy & Security → scroll down → **Open Anyway**.
            - If it says "damaged" instead, run this once in Terminal:
              `xattr -dr com.apple.quarantine /Applications/ClawdAssistant.app`
            - The Claude app must be installed and signed in first.

            `clawd-skill.zip` is the clawd skill, for Claude's Capabilities → Skills.

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build universal .dmg
        working-directory: src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          files: dist/*
